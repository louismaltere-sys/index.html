  ex:"MiFID II impose aux PSI utilisant le trading algorithmique : des tests pré-déploiement rigoureux, un kill switch permettant l'arrêt immédiat de tous les algorithmes, des limites sur les ordres et les volumes par instrument, la notification à l'AMF de l'utilisation d'algorithmes, et la conservation des données de trading pendant au moins 5 ans.",
  tags:['trading algorithmique','HFT','kill switch','MiFID II','obligations']},
{id:'MF20',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une opération sur titres (OST) et quels sont les exemples les plus courants ?",
  opts:["La vente de titres par un émetteur sur le marché primaire lors d'une émission","Tout événement corporatif affectant les titres d'un émetteur : dividende, augmentation de capital, split, regroupement, fusion-absorption, OPA, remboursement d'obligation...","Le reporting mensuel des transactions de titres réalisé par les dépositaires à l'AMF","L'opération de rachat de titres propres par une société cotée pour l'annulation"],
  ans:[1],
  ex:"Les OST (Corporate Actions) sont initiées par l'émetteur et affectent les détenteurs de titres : détachement et paiement de dividendes, augmentations de capital (avec ou sans DPS), splits ou regroupements d'actions, fusions-absorptions, OPA/OPE, remboursements et amortissements d'obligations. Leur traitement est standardisé via les règles SWIFT et géré par les CSD.",
  tags:['OST','corporate actions','dividende','augmentation capital','SWIFT']},

// ──────────── ESG (suite) ────────────
{id:'ES09',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"À qui s'applique la directive CSRD et quelle est son exigence centrale ?",
  opts:["Uniquement aux sociétés du CAC 40 depuis 2022","Progressivement aux grandes entreprises de l'UE depuis 2024, qui doivent reporter selon les ESRS sur la base de la double matérialité (impacts de l'entreprise ET risques pour l'entreprise)","À toutes les entreprises de plus de 50 salariés depuis 2021","Uniquement aux sociétés de gestion gérant des fonds Article 9 SFDR"],
  ans:[1],
  ex:"La CSRD (Corporate Sustainability Reporting Directive) impose un reporting de durabilité standardisé selon les ESRS (European Sustainability Reporting Standards). Elle s'applique progressivement : grandes sociétés cotées (rapport 2024), autres grandes entreprises (rapport 2025), PME cotées (rapport 2026). L'exigence centrale est la double matérialité.",
  tags:['CSRD','ESRS','reporting durabilité','double matérialité']},
{id:'ES10',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Que signifie le critère DNSH dans la taxonomie européenne et donner un exemple d'application ?",
  opts:["'Do Not Sell Herein' — l'interdiction de vendre des titres de sociétés nuisibles","'Do No Significant Harm' — une activité contribuant à l'atténuation climatique ne doit pas nuire significativement aux 5 autres objectifs environnementaux (ex: biodiversité, eau, déchets)","'Do Not State Harm' — la non-divulgation d'impacts environnementaux négatifs","'Diversify Not Sector Holdings' — la règle de diversification sectorielle des fonds verts"],
  ans:[1],
  ex:"DNSH (Do No Significant Harm) est un critère croisé de la taxonomie UE. Exemple : une centrale à hydrogène 'vert' contribue à l'objectif d'atténuation climatique mais si elle consomme des quantités excessives d'eau, elle pourrait nuire à l'objectif 'utilisation durable de l'eau' — elle ne serait alors pas qualifiée de 'verte' selon la taxonomie.",
  tags:['DNSH','taxonomie UE','objectifs environnementaux','exemple']},
{id:'ES11',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que la transition juste et pourquoi est-elle importante dans l'ISR ?",
  opts:["La transition entre l'approche ESG traditionnelle et les nouvelles normes CSRD","Le concept voulant que la transition vers une économie bas-carbone soit équitable pour les travailleurs et communautés affectées, intégré dans les stratégies ISR sociales","La migration légale des fonds Article 6 vers les fonds Article 8 et 9","Le passage progressif d'un portefeuille conventionnel vers un portefeuille aligné Paris"],
  ans:[1],
  ex:"La transition juste (Just Transition) reconnaît que la transition énergétique doit être équitable : ne pas laisser de côté les travailleurs et communautés dépendants des industries fossiles (mineurs, sidérurgistes). De nombreuses stratégies ISR intègrent désormais cet enjeu social dans leurs critères, au-delà des simples critères environnementaux.",
  tags:['transition juste','ISR','facteur social','transition énergétique']},
{id:'ES12',module:'esg',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que l'investissement à impact et en quoi se distingue-t-il de l'ISR classique ?",
  opts:["L'impact investing désigne l'investissement dans les entreprises à fort impact médiatique","L'impact investing cherche à générer des effets positifs mesurables et additionnels sur la société/l'environnement — l'impact est l'objectif principal, non un simple filtre de sélection","L'impact investing désigne les fonds dont 100 % de l'actif est investi dans des obligations vertes","Il s'agit du même concept, l'impact investing et l'ISR sont des termes interchangeables"],
  ans:[1],
  ex:"L'impact investing se distingue par trois critères : (1) intentionnalité — l'impact est l'objectif central ; (2) mesurabilité — l'impact doit être quantifié (ex: tonnes de CO2 évitées, emplois créés) ; (3) additionnalité — l'investissement génère un impact qui n'aurait pas existé sans lui. Contrairement à l'ISR classique qui sélectionne des entreprises déjà vertueuses.",
  tags:['impact investing','intentionnalité','additionnalité','mesurabilité']},
{id:'ES13',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Quel est le lien entre le CBAM (mécanisme d'ajustement carbone aux frontières) et le marché carbone européen ETS ?",
  opts:["Le CBAM remplace l'ETS pour les secteurs industriels couverts","Le CBAM est complémentaire à l'ETS : il impose aux importateurs de payer un prix carbone équivalent au prix ETS pour éviter les fuites de carbone (délocalisation des émissions)","Le CBAM est un fonds d'investissement pour les pays en voie de développement financé par les recettes de l'ETS","Le CBAM fixe le prix du carbone pour les importations, l'ETS pour les exportations"],
  ans:[1],
  ex:"Le CBAM (Carbon Border Adjustment Mechanism) et l'ETS se complètent : l'ETS fixe un prix carbone pour les producteurs européens (via l'achat de quotas). Sans CBAM, les producteurs étrangers importeraient sans payer de prix carbone, créant une concurrence déloyale et poussant les entreprises à délocaliser (fuites de carbone). Le CBAM nivelle le terrain.",
  tags:['CBAM','ETS','fuites de carbone','complémentarité','prix carbone']},
{id:'ES14',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que l'EU ETS (marché du carbone européen) et comment détermine-t-il le prix du carbone ?",
  opts:["Un registre administratif des émissions de CO2 des entreprises françaises géré par l'ADEME","Le plus grand marché carbone mondial : les entreprises doivent détenir un quota (EUA) par tonne de CO2 émise, les quotas étant alloués et échangés — le prix découle de l'offre et de la demande","Une taxe carbone fixée annuellement par la Commission Européenne et applicable à tous les secteurs","Un mécanisme de compensation de carbone permettant d'acheter des crédits dans les pays en développement"],
  ans:[1],
  ex:"L'EU ETS (créé en 2005) couvre les installations industrielles lourdes et la production d'électricité. Les entreprises reçoivent ou achètent des EUA (European Union Allowances, 1 EUA = 1 tonne CO2). Le plafond total est fixé et réduit annuellement (cap & trade). Le prix du carbone est déterminé par le marché, avec un prix plancher depuis la réforme 2023.",
  tags:['EU ETS','cap and trade','EUA','prix carbone','quotas']},
{id:'ES15',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Quelles sont les principales critiques formulées à l'encontre des notations ESG des agences de notation ?",
  opts:["Elles sont trop strictes et excluent trop d'entreprises des univers d'investissement","Manque d'harmonisation (divergences significatives entre agences pour une même entreprise), manque de transparence des méthodologies, et risque de conflit d'intérêts (modèle émetteur-payeur)","Elles sont trop axées sur les critères environnementaux et négligent le social et la gouvernance","Elles sont trop coûteuses pour les petites entreprises qui souhaitent être notées"],
  ans:[1],
  ex:"Les principales critiques des notations ESG : (1) Divergences entre agences — la corrélation entre les notes ESG de MSCI, Sustainalytics et ISS est faible (environ 0,5, vs >0,9 pour les agences de notation crédit) ; (2) Manque de transparence des méthodologies ; (3) Conflit d'intérêts potentiel (modèle émetteur-payeur similaire aux agences crédit pré-2008). La Commission européenne travaille à une réglementation des fournisseurs de notations ESG.",
  tags:['notation ESG','divergences','transparence','critique','réglementation']},
{id:'ES16',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le label ISR rénové en 2024 et quelles sont ses nouvelles exigences d'exclusion ?",
  opts:["Le label ISR 2024 supprime les exclusions sectorielles pour être plus inclusif","Le label ISR 2024 renforce les exclusions : interdiction d'investir dans les entreprises exploitant du charbon thermique et de nouveaux projets d'hydrocarbures, et introduit des critères climatiques (alignement Paris)","Le label ISR 2024 devient équivalent au label européen Article 9 SFDR","Le label ISR 2024 est fusionné avec le label Greenfin géré par l'ADEME"],
  ans:[1],
  ex:"Le référentiel du label ISR révisé (entré en vigueur en mars 2024) introduit des exigences significativement renforcées : exclusion des entreprises développant de nouveaux champs pétroliers/gaziers, interdiction d'investir dans le charbon thermique (exploitation et développement), et introduction d'objectifs de réduction des émissions de GES dans les portefeuilles.",
  tags:['label ISR','2024','exclusions','charbon','hydrocarbures']},
{id:'ES17',module:'esg',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un green bond (obligation verte) et qui en certifie la conformité ?",
  opts:["Une obligation émise par des États jugés écologiques par les agences de notation","Une obligation dont les fonds sont exclusivement affectés à des projets environnementaux — la conformité est vérifiée selon les Green Bond Principles (ICMA) ou la norme EU Green Bond Standard","Un bon d'État à taux zéro pour financer la transition énergétique des pays membres de l'UE","Une obligation dont le coupon est indexé sur des indicateurs ESG de l'émetteur"],
  ans:[1],
  ex:"Un green bond (obligation verte) est un titre de dette dont le produit est exclusivement utilisé pour financer des projets environnementaux (énergie renouvelable, efficacité énergétique, transport propre…). Les Green Bond Principles de l'ICMA sont le cadre de référence volontaire dominant. La norme EU Green Bond Standard (EUGBS, 2023) propose un cadre plus exigeant lié à la taxonomie UE.",
  tags:['green bond','obligation verte','ICMA','EU GBS','taxonomie']},
{id:'ES18',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que les indices PAB (Paris-Aligned Benchmark) et CTB (Climate Transition Benchmark) ?",
  opts:["Des indices boursiers excluant toutes les entreprises à émissions positives de CO2","Des indices de référence réglementés par la Commission européenne, respectivement alignés avec une trajectoire de réchauffement maximal de 1,5°C (PAB) et en transition vers la neutralité carbone (CTB)","Des notations ESG attribuées par l'ESMA aux portefeuilles institutionnels","Des fonds indiciels créés par la BCE pour financer la transition énergétique"],
  ans:[1],
  ex:"Les indices PAB et CTB ont été créés par le règlement européen (UE 2019/2089) pour fournir des références climatiques standardisées. Les PAB (Paris-Aligned Benchmarks) ciblent une trajectoire de +1,5°C (réduction d'empreinte carbone de 50 % vs marché, puis 7 % par an). Les CTB (Climate Transition Benchmarks) visent une trajectoire de +2°C (30 % de réduction initiale, puis 7 %/an).",
  tags:['PAB','CTB','indices climatiques','1,5°C','règlement européen']},
{id:'ES19',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que la TCFD et quels sont ses 4 piliers ?",
  opts:["L'agence des Nations Unies supervisant les fonds climatiques — 4 piliers : Financement, Technologie, Capacité, Développement","Un groupe de travail du FSB qui a créé un cadre de reporting volontaire sur les risques climatiques — 4 piliers : Gouvernance, Stratégie, Gestion des risques, Métriques et cibles","Le comité de l'ESMA en charge du reporting ESG — 4 piliers : SFDR, CSRD, Taxonomie, PAI","L'autorité française chargée du reporting climatique — 4 piliers : Bilan carbone, Transition, Financement, Reporting"],
  ans:[1],
  ex:"La TCFD (Task Force on Climate-related Financial Disclosures, créée en 2015 par le Financial Stability Board) a développé des recommandations de reporting climatique volontaires, devenues quasi-obligatoires dans de nombreux pays. Ses 4 piliers : Gouvernance (oversight du CA/direction), Stratégie (impacts sur le business), Gestion des risques (identification, évaluation), Métriques et cibles (KPIs et objectifs).",
  tags:['TCFD','FSB','4 piliers','gouvernance','risques climatiques']},
{id:'ES20',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la différence entre l'approche Best-in-Class et l'approche Best-in-Universe en ISR ?",
  opts:["Best-in-Class sélectionne les leaders ESG par secteur en maintenant la diversification sectorielle ; Best-in-Universe sélectionne les meilleurs ESG tous secteurs confondus, acceptant une concentration sectorielle","Best-in-Class cible les grandes capitalisations, Best-in-Universe les small caps et mid caps ESG","Best-in-Class utilise des critères quantitatifs, Best-in-Universe des critères qualitatifs","Best-in-Class s'applique aux actions, Best-in-Universe aux obligations vertes"],
  ans:[0],
  ex:"En Best-in-Class, les meilleurs élèves ESG sont sélectionnés dans chaque secteur → diversification sectorielle proche d'un indice classique, y compris des secteurs polluants améliorés. En Best-in-Universe, les titres sont sélectionnés parmi tous les meilleurs scores ESG toutes industries → concentration vers les secteurs naturellement vertueux (tech, services). Les deux approches ont des avantages selon l'objectif.",
  tags:['best-in-class','best-in-universe','ISR','diversification sectorielle']},

// ──────────── LCB-FT (suite) ────────────
{id:'LB09',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Quelles sont les 3 étapes classiques du processus de blanchiment de capitaux ?",
  opts:["Collecte — transfert — investissement","Placement — empilement (layering) — intégration","Camouflage — dispersion — consolidation","Introduction — circulation — extraction"],
  ans:[1],
  ex:"Le blanchiment se déroule en 3 étapes : (1) Placement — introduction des fonds illicites dans le système financier légal (ex: dépôts fractionnés, achats immobiliers) ; (2) Empilement (layering) — multiplication des transactions pour brouiller la piste (virements internationaux, conversion en crypto-actifs) ; (3) Intégration — les fonds réapparaissent dans l'économie légale sous forme légitime.",
  tags:['blanchiment','placement','empilement','intégration','3 étapes']},
{id:'LB10',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la vigilance renforcée et dans quels cas est-elle obligatoirement appliquée ?",
  opts:["Une vérification trimestrielle de l'identité de tous les clients, quel que soit leur profil de risque","Des mesures de diligence additionnelles — vérifications approfondies, approbation hiérarchique, surveillance accrue — obligatoires pour les PPE, les clients de pays à risque, et les relations à risque élevé identifiées","L'obligation de refuser tout client provenant de pays figurant sur la liste noire du GAFI","Un double contrôle systématique pour toutes les transactions supérieures à 10 000 €"],
  ans:[1],
  ex:"La vigilance renforcée est obligatoire pour : (1) les PPE (et leurs proches) ; (2) les clients établis dans des pays à risque identifiés (liste GAFI grise/noire) ; (3) les relations ou transactions présentant des facteurs de risque élevé selon l'évaluation interne. Elle implique : informations supplémentaires sur l'origine des fonds, approbation de la hiérarchie supérieure, surveillance accrue des transactions.",
  tags:['vigilance renforcée','PPE','pays à risque','LCB-FT','approche par les risques']},
{id:'LB11',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le 'smurfing' ou structuration en LCB-FT et pourquoi est-il illégal en lui-même ?",
  opts:["Une technique légale de diversification d'investissements financiers entre plusieurs établissements","Le fractionnement délibéré d'une transaction en plusieurs petites opérations pour passer sous les seuils déclenchant des contrôles ou déclarations — illégal même indépendamment de l'intention de blanchiment","Une méthode d'optimisation fiscale légale consistant à répartir des versements dans le temps","La répartition légale d'actifs entre différentes juridictions pour réduire l'exposition fiscale"],
  ans:[1],
  ex:"Le smurfing (ou structuration) consiste à fractionner délibérément une transaction (ex: 20 000 € en 5 virements de 3 900 €) pour passer sous les seuils de vigilance. Il est illégal en soi, même sans blanchiment avéré, car il est présumé viser à contourner les contrôles. Les établissements doivent détecter les schémas de structuration.",
  tags:['smurfing','structuration','fractionnement','LCB-FT','illégalité']},
{id:'LB12',module:'lcbft',type:'qcm',diff:'easy',pts:10,
  q:"Quelle est la différence entre la liste noire et la liste grise du GAFI ?",
  opts:["Il n'y a qu'une liste, la distinction noire/grise est informelle","Liste noire : pays faisant l'objet d'un appel à l'action (contre-mesures actives) ; liste grise : pays sous surveillance renforcée (en cours d'amélioration de leur dispositif)","Liste noire : personnes physiques sanctionnées ; liste grise : entités juridiques sous enquête","Liste noire : pays sanctionnés par l'ONU ; liste grise : pays jugés insuffisants par l'UE"],
  ans:[1],
  ex:"Le GAFI publie deux listes : (1) Juridictions sous 'Appel à l'action' (liste noire) — pays présentant des déficiences graves et non adressées, pour lesquels des contre-mesures renforcées sont recommandées (ex: Iran, Corée du Nord) ; (2) Juridictions sous 'Surveillance renforcée' (liste grise) — pays ayant identifié des faiblesses et s'engageant à les corriger.",
  tags:['liste noire GAFI','liste grise','surveillance renforcée','contre-mesures']},
{id:'LB13',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Comment l'approche basée sur les risques (ABR) s'applique-t-elle concrètement dans un PSI ?",
  opts:["Tous les clients reçoivent le même niveau de vigilance — l'ABR s'applique uniquement aux contrôles internes","L'ABR impose d'évaluer chaque relation selon des critères de risque (client, géographie, produit, canal) et d'adapter le niveau de vigilance (simplifiée, standard, renforcée) et la fréquence des revues KYC","L'ABR permet aux PSI de décider librement de ne pas appliquer de vigilance pour certaines catégories de clients","L'ABR s'applique uniquement lors de l'entrée en relation, pas pour le suivi des relations existantes"],
  ans:[1],
  ex:"En pratique, l'ABR dans un PSI implique : (1) une évaluation initiale des risques de chaque client (scoring) ; (2) une adaptation du niveau de vigilance : simplifiée pour les fonds monétaires UCITS, renforcée pour les PPE ; (3) une revue périodique des relations dont la fréquence dépend du niveau de risque (annuelle pour risque élevé, tous les 3 ans pour risque faible) ; (4) une documentation de la justification.",
  tags:['ABR','approche par les risques','5ème directive','scoring','revue KYC']},
{id:'LB14',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Quel est le rôle du COLB (Conseil d'Orientation de la Lutte contre le Blanchiment) ?",
  opts:["Un tribunal spécialisé dans les affaires de blanchiment de capitaux","L'organe français interministériel qui coordonne la stratégie nationale LCB-FT, pilote l'évaluation nationale des risques (ENR) et assure la liaison avec les instances internationales (GAFI, MONEYVAL)","L'équivalent français de la CRF (Cellule de Renseignement Financier)","Le conseil de supervision de TRACFIN créé par la loi Sapin II"],
  ans:[1],
  ex:"Le COLB est un organe interministériel placé sous la double tutelle du Ministère des Finances et du Ministère de la Justice. Il pilote l'Évaluation Nationale des Risques (ENR), coordonne l'action des différents acteurs du dispositif français LCB-FT, représente la France au GAFI et au Comité Moneyval du Conseil de l'Europe.",
  tags:['COLB','stratégie nationale','ENR','GAFI','interministériel']},
{id:'LB15',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que l'AMLA et quel sera son périmètre de supervision directe ?",

function saveData() {
  try { localStorage.setItem('amfprep_v2', JSON.stringify(DATA)); } catch(e){}
}
function loadData() {
  try {
    const raw = localStorage.getItem('amfprep_v2');
    if (raw) { const d = JSON.parse(raw); DATA = {...DATA, ...d}; }
  } catch(e){}
  // Init module progress
  MODULES.forEach(m => {
    if (!DATA.moduleProgress[m.id]) {
      DATA.moduleProgress[m.id] = { quizzes:0, correct:0, total:0, bestScore:0 };
    }
  });
  // Update streak
  updateStreak();
}
function resetData() {
  if (!confirm('Remettre à zéro toute votre progression ? Cette action est irréversible.')) return;
  localStorage.removeItem('amfprep_v2');
  DATA = {
    xp:0, level:0, streak:0, lastActiveDate:null,
    totalQuizzes:0, totalAnswered:0, totalCorrect:0, avgScore:0,
    moduleProgress:{}, history:[], earnedBadges:[], activity:{}, lastScores:[]
  };
  MODULES.forEach(m => { DATA.moduleProgress[m.id] = {quizzes:0,correct:0,total:0,bestScore:0}; });
  saveData();
  toast('Progression réinitialisée', 'info');
  updateSidebar();
  navigate('dashboard');
}
function updateStreak() {
  const today = new Date().toDateString();
  if (DATA.lastActiveDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (DATA.lastActiveDate === yesterday) {
    DATA.streak++;
  } else if (DATA.lastActiveDate !== today) {
    DATA.streak = 0;
  }
  DATA.lastActiveDate = today;
  DATA.activity[today] = (DATA.activity[today] || 0) + 1;
  saveData();
}

/* ═══════════════════════════════════════════════════════════
   XP & LEVELS
═══════════════════════════════════════════════════════════ */
function addXP(amount) {
  DATA.xp += amount;
  const prevLevel = DATA.level;
  for (let i = LEVEL_XP.length - 1; i >= 0; i--) {
    if (DATA.xp >= LEVEL_XP[i]) { DATA.level = i; break; }
  }
  if (DATA.level > prevLevel) {
    toast(`🎉 Niveau ${DATA.level+1} — ${LEVEL_NAMES[DATA.level]} !`, 'success');
    launchConfetti();
  }
  updateSidebar();
  saveData();
}
function getLevelProgress() {
  const l = DATA.level;
  const curr = LEVEL_XP[l] || 0;
  const next  = LEVEL_XP[l+1] || LEVEL_XP[l] + 1000;
  const pct   = Math.min(100, Math.round((DATA.xp - curr) / (next - curr) * 100));
  return { pct, curr, next, xpInLevel: DATA.xp - curr, xpNeeded: next - curr };
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR UPDATE
═══════════════════════════════════════════════════════════ */
function updateSidebar() {
  const lp = getLevelProgress();
  document.getElementById('sb-xp-fill').style.width = lp.pct + '%';
  document.getElementById('sb-xp-val').textContent = DATA.xp + ' XP';
  document.getElementById('sb-xp-next').textContent = (LEVEL_XP[DATA.level+1] || '—') + ' XP';
  document.getElementById('sb-level-num').textContent = 'Niv. ' + (DATA.level+1);
  document.getElementById('sb-level-name').textContent = LEVEL_NAMES[DATA.level] || 'Grand Master';
  document.getElementById('sb-streak').textContent = DATA.streak + (DATA.streak > 1 ? ' jours de suite' : ' jour');
  document.getElementById('tb-xp').textContent = DATA.xp + ' XP';
}

/* ═══════════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════════ */
function navigate(view, params = {}) {
  // Destroy charts
  Object.values(APP.charts).forEach(c => { try { c.destroy(); } catch(e){} });
  APP.charts = {};
  // Stop quiz timer
  if (APP.quiz && APP.quiz.timer) { clearInterval(APP.quiz.timer); APP.quiz.timer = null; }

  APP.view = view;
  APP.params = params;

  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === view);
  });

  // Update topbar title
  const titles = {
    dashboard:'Dashboard', modules:'Modules', exam:'Examen Blanc',
    analytics:'Statistiques', badges:'Badges & Niveaux',
    module_detail:'Module', quiz:'Quiz', results:'Résultats'
  };
  document.getElementById('topbar-title').textContent = titles[view] || view;

  // Render
  const page = document.getElementById('page');
  page.innerHTML = '';
  page.classList.remove('animate-in');
  void page.offsetWidth;
  page.classList.add('animate-in');

  switch(view) {
    case 'dashboard':     renderDashboard(); break;
    case 'modules':       renderModules(); break;
    case 'module_detail': renderModuleDetail(params.moduleId); break;
    case 'quiz':          renderQuiz(); break;
    case 'exam':          renderExam(); break;
    case 'analytics':     renderAnalytics(); break;
    case 'badges':        renderBadges(); break;
    case 'results':       renderResults(params); break;
  }
  closeSidebar();
}

function buildHeatmap() {
  const grid = document.getElementById('heatmap');
  if (!grid) return;
  const days = 182;
  const cells = [];
  for (let i = days-1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const key = d.toDateString();
    const count = DATA.activity[key] || 0;
    const heat = count === 0 ? 0 : count < 3 ? 1 : count < 5 ? 2 : count < 8 ? 3 : 4;
    cells.push(`<div class="heatmap-cell heat-${heat}" title="${d.toLocaleDateString('fr-FR')}: ${count} quiz"></div>`);
  }
  grid.innerHTML = cells.join('');
}

function startQuiz(moduleId, mode) {
  const qs = QUESTIONS.filter(q=>q.module===moduleId);
  const shuffled = [...qs].sort(()=>Math.random()-0.5);
  APP.quiz = {
    moduleId, mode,
    questions: shuffled,
    current: 0,
    answers: [], // {qi, correct, selected, time}
    score: 0,
    correct: 0,
    startTime: Date.now(),
    questionStart: Date.now(),
    timer: null,
    elapsed: 0,
    isExam: false
  };
  navigate('quiz');
}

function startFullExam() {
  // 4 questions per module, shuffled
  let qs = [];
  MODULES.forEach(m => {
    const mqs = QUESTIONS.filter(q=>q.module===m.id);
    const pick = [...mqs].sort(()=>Math.random()-0.5).slice(0,4);
    qs = qs.concat(pick);
  });
  qs = qs.sort(()=>Math.random()-0.5);
  APP.quiz = {
    moduleId: 'exam',
    mode: 'exam',
    questions: qs,
    current: 0,
    answers: [],
    score: 0,
    correct: 0,
    startTime: Date.now(),
    questionStart: Date.now(),
    timer: null,
    elapsed: 0,
    timeLimit: 60 * 60, // 60 minutes
    isExam: true
  };
  navigate('quiz');
}

}

let _timerSelected = [];
function selectOption(i) {
  if (APP.quiz.validated) return;
  const curr = APP.quiz.questions[APP.quiz.current];
  const btn = document.getElementById('opt-' + i);

  if (curr.ans.length > 1) {
    // Multi-select
    if (APP.quiz.selected.includes(i)) {
      APP.quiz.selected = APP.quiz.selected.filter(x=>x!==i);
      btn.classList.remove('selected');
    } else {
      APP.quiz.selected.push(i);
      btn.classList.add('selected');
    }
  } else {
    // Single select
    document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
    APP.quiz.selected = [i];
    btn.classList.add('selected');
  }

  // Show validate button (both modes)
  const vb = document.getElementById('validate-btn');
  if (APP.quiz.selected.length > 0) {
    vb.style.display = '';
  }
}

function validateAnswer() {
  if (APP.quiz.validated || APP.quiz.selected.length === 0) return;
  APP.quiz.validated = true;

  const curr = APP.quiz.questions[APP.quiz.current];
  const selected = APP.quiz.selected.sort();
  const correct  = curr.ans.sort();
  const isCorrect = JSON.stringify(selected) === JSON.stringify(correct);
  const timeSpent = Math.round((Date.now() - APP.quiz.questionStart) / 1000);

  APP.quiz.answers.push({ qi: APP.quiz.current, correct: isCorrect, selected, time: timeSpent });

  // Color options
  curr.opts.forEach((_, i) => {
    const btn = document.getElementById('opt-' + i);
    if (!btn) return;
    btn.disabled = true;
    if (correct.includes(i) && selected.includes(i)) btn.classList.add('correct');
    else if (selected.includes(i) && !correct.includes(i)) btn.classList.add('wrong');
    else if (correct.includes(i)) btn.classList.add('correct');
  });

  if (isCorrect) {
    APP.quiz.correct++;
    APP.quiz.score += curr.pts;
    document.getElementById('live-correct').textContent = APP.quiz.correct;
    document.getElementById('live-xp').textContent = APP.quiz.score + ' XP';
  } else {
    document.getElementById('live-wrong').textContent = APP.quiz.current + 1 - APP.quiz.correct;
  }

  // Toujours afficher la correction si mauvaise réponse ; en mode entraînement aussi si correct
  if (!isCorrect || APP.quiz.mode !== 'exam') {
    const expBox = document.getElementById('explanation-box');
    const correctLabels = curr.ans.map(i => `<strong>${'ABCD'[i]}.</strong> ${curr.opts[i]}`).join(' &amp; ');
    expBox.innerHTML = `<div class="explanation-box ${!isCorrect ? 'explanation-wrong' : ''}">
      ${!isCorrect
        ? `<div class="exp-header-wrong">✗ Mauvaise réponse — La bonne réponse était :<br><span class="exp-correct-label">${correctLabels}</span></div>`
        : `<div class="exp-header-ok">✓ Correct !</div>`
      }
      <div class="exp-body">${curr.ex}</div>
    </div>`;
  }

  // Hide validate, show next
  document.getElementById('validate-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
}

function nextQuestion() {
  // In exam mode, auto-validate if not done
  if (!APP.quiz.validated && APP.quiz.selected.length > 0) {
    const curr = APP.quiz.questions[APP.quiz.current];
    const selected = APP.quiz.selected.sort();
    const correct  = curr.ans.sort();
    const isCorrect = JSON.stringify(selected) === JSON.stringify(correct);
    const timeSpent = Math.round((Date.now() - APP.quiz.questionStart) / 1000);
    APP.quiz.answers.push({ qi: APP.quiz.current, correct: isCorrect, selected, time: timeSpent });
    if (isCorrect) { APP.quiz.correct++; APP.quiz.score += curr.pts; }
  } else if (!APP.quiz.validated) {
    // Skipped
    APP.quiz.answers.push({ qi: APP.quiz.current, correct: false, selected: [], time: 0, skipped: true });
  }

  APP.quiz.current++;
  if (APP.quiz.current >= APP.quiz.questions.length) {
    endQuiz();
  } else {
    renderQuiz();
  }
}

function startQuizTimer() {
  if (APP.quiz.timer) clearInterval(APP.quiz.timer);
  let elapsed = 0;
  let totalSeconds = APP.quiz.timeLimit || null;

  APP.quiz.timer = setInterval(() => {
    elapsed++;
    APP.quiz.elapsed = elapsed;
    const tv = document.getElementById('timer-val');
    if (!tv) { clearInterval(APP.quiz.timer); return; }

    if (APP.quiz.isExam && totalSeconds) {
      const remaining = totalSeconds - elapsed;
      if (remaining <= 0) { clearInterval(APP.quiz.timer); endQuiz(); return; }
      const m = Math.floor(remaining/60), s = remaining%60;
      tv.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      const timerEl = document.getElementById('exam-timer');
      if (timerEl) {
        if (remaining < 120) timerEl.classList.add('danger');
        else if (remaining < 600) timerEl.classList.add('warning');
      }
    } else {
      tv.textContent = elapsed + 's';
      const timerEl = document.getElementById('q-timer');
      if (timerEl) {
        if (elapsed > 60) timerEl.classList.add('danger');
        else if (elapsed > 30) timerEl.classList.add('warning');
      }
    }
  }, 1000);
}

function confirmQuitQuiz() {
  if (confirm('Voulez-vous vraiment quitter le quiz ? Votre progression sera perdue.')) {
    clearInterval(APP.quiz.timer);
    APP.quiz = null;
    navigate(APP.params.moduleId ? 'module_detail' : 'modules', APP.params);
  }
}

function endQuiz() {
  if (APP.quiz.timer) { clearInterval(APP.quiz.timer); APP.quiz.timer = null; }
  const q = APP.quiz;
  const total = q.questions.length;
  const score = total > 0 ? Math.round(q.correct / total * 100) : 0;
  const duration = formatDuration(q.elapsed);

  // XP bonus
  let xpEarned = q.score;
  if (score >= 80) xpEarned += 50;
  else if (score >= 60) xpEarned += 25;

  // Update stats
  DATA.totalQuizzes++;
  DATA.totalAnswered += total;
  DATA.totalCorrect  += q.correct;
  if (DATA.totalAnswered > 0) DATA.avgScore = Math.round(DATA.totalCorrect / DATA.totalAnswered * 100);

  // Update module progress
  if (q.moduleId !== 'exam') {
    const mp = DATA.moduleProgress[q.moduleId] || {quizzes:0,correct:0,total:0,bestScore:0};
    mp.quizzes++;
    mp.correct += q.correct;
    mp.total   += total;
    mp.bestScore = Math.max(mp.bestScore, score);
    DATA.moduleProgress[q.moduleId] = mp;
  }

  // History
  const m = MODULES.find(x=>x.id===q.moduleId);
  DATA.history.push({
    moduleId: q.moduleId,
    score,
    total,
    correct: q.correct,
    date: new Date().toLocaleDateString('fr-FR'),
    duration,
    xp: xpEarned,
    isExam: q.isExam
  });
  if (DATA.history.length > 50) DATA.history = DATA.history.slice(-50);

  // Track scores
  if (!DATA.lastScores) DATA.lastScores = [];
  DATA.lastScores.push(score);
  if (DATA.lastScores.length > 10) DATA.lastScores.shift();

  // Activity
  const today = new Date().toDateString();
  DATA.activity[today] = (DATA.activity[today] || 0) + 1;
  DATA.lastActiveDate = today;

  addXP(xpEarned);
  checkBadges(score, q);
  saveData();

  navigate('results', {
    score, total, correct: q.correct,
    questions: q.questions,
    answers: q.answers,
    xpEarned, duration, moduleId: q.moduleId,
    isExam: q.isExam,
    elapsed: q.elapsed
  });
}

function formatDuration(seconds) {
  if (!seconds) return '0s';
  if (seconds < 60) return seconds + 's';
  return Math.floor(seconds/60) + 'min ' + (seconds%60) + 's';
}

            min: 0, max: 100,
            ticks: { stepSize: 25, color: '#6b7280', font: {size:10} },
            grid: { color: 'rgba(255,255,255,0.06)' },
            pointLabels: { color: '#9ca3af', font: {size:10} }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
  }

  // HISTORY LINE
  const histCtx = document.getElementById('chart-history');
  if (histCtx) {
    const history = DATA.history.slice(-15);
    const labels  = history.map((_,i)=>`Q${i+1}`);
    const scores  = history.map(h=>h.score);
    APP.charts.history = new Chart(histCtx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Score (%)',
          data: scores,
          borderColor: '#06b6d4',
          backgroundColor: 'rgba(6,182,212,0.08)',
          borderWidth: 2,
          fill: true,
          tension: 0.4,
          pointRadius: 4,
          pointBackgroundColor: '#06b6d4'
        }, {
          label: 'Seuil 75%',
          data: new Array(scores.length).fill(75),
          borderColor: 'rgba(16,185,129,0.5)',
          borderWidth: 1,
          borderDash: [4,4],
          pointRadius: 0,
          fill: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          x: { ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } }
        },
        plugins: { legend: { labels: { color: '#9ca3af', font:{size:11} } } }
      }
    });
  }

  // SCORE DISTRIBUTION (bar)
  const distCtx = document.getElementById('chart-score-dist');
  if (distCtx) {
    const recent = (DATA.lastScores||[]).slice(-10);
    const labels = recent.map((_,i)=>`Quiz ${i+1}`);
    const colors = recent.map(s => s>=75?'rgba(16,185,129,0.7)':s>=50?'rgba(245,158,11,0.7)':'rgba(239,68,68,0.7)');
    APP.charts.dist = new Chart(distCtx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Score (%)',
          data: recent,
          backgroundColor: colors,
          borderRadius: 6,
          borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          y: { min: 0, max: 100, ticks: { color: '#6b7280' }, grid: { color: 'rgba(255,255,255,0.04)' } },
          x: { ticks: { color: '#6b7280' }, grid: { display: false } }
        },
        plugins: { legend: { display: false } }
      }
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   BADGES LOGIC
═══════════════════════════════════════════════════════════ */
function checkBadges(score, quizSession) {
  const earned = new Set(DATA.earnedBadges);
  const prev = earned.size;

  if (!earned.has('first_quiz') && DATA.totalQuizzes >= 1) earned.add('first_quiz');
  if (!earned.has('perfect_score') && score === 100) earned.add('perfect_score');
  if (!earned.has('streak_3') && DATA.streak >= 3) earned.add('streak_3');
  if (!earned.has('streak_7') && DATA.streak >= 7) earned.add('streak_7');
  if (!earned.has('level_5') && DATA.level >= 4) earned.add('level_5');
  if (!earned.has('all_modules') && MODULES.every(m=>(DATA.moduleProgress[m.id]?.bestScore||0)>=60)) earned.add('all_modules');
  if (!earned.has('hundred_q') && DATA.totalAnswered >= 100) earned.add('hundred_q');
  if (!earned.has('exam_pass') && quizSession.isExam && score >= 75) earned.add('exam_pass');
  if (!earned.has('speed_demon') && quizSession.answers.length > 0) {
    const avgT = quizSession.answers.reduce((a,x)=>a+x.time,0)/quizSession.answers.length;
    if (avgT < 15) earned.add('speed_demon');
  }
  if (!earned.has('consistent') && (DATA.lastScores||[]).slice(-5).length >= 5) {
    if ((DATA.lastScores||[]).slice(-5).every(s=>s>=80)) earned.add('consistent');
  }

  if (earned.size > prev) {
    DATA.earnedBadges = [...earned];
    const newBadges = [...earned].filter(b=>!DATA.earnedBadges.slice(0,-earned.size+prev).includes(b));
    newBadges.forEach(bid => {
      const b = BADGES_DEF.find(x=>x.id===bid);
      if (b) toast(`${b.emoji} Badge débloqué : ${b.name} !`, 'success');
    });
  }
}

/* ═══════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════ */
function toast(msg, type='info') {
  const icons = { success:'✅', error:'❌', info:'ℹ️', warning:'⚠️' };
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]||'📢'}</span><span style="flex:1;font-size:13px">${msg}</span>`;
  tc.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function launchConfetti() {
  const colors = ['#7c3aed','#06b6d4','#10b981','#f59e0b','#ec4899'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${Math.random()*100}vw;
      top: 0;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration: ${1.5 + Math.random()*2}s;
      animation-delay: ${Math.random()*0.8}s;
      width: ${4+Math.random()*8}px;
      height: ${4+Math.random()*8}px;
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('visible');
}
