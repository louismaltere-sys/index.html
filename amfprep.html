<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMF Prep — Certification Excellence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════ */
:root {
  --bg-base:        #05050e;
  --bg-surface:     #09091a;
  --bg-card:        #0d0d22;
  --bg-card-hover:  #111128;
  --bg-elevated:    #141430;
  --border:         rgba(124, 58, 237, 0.15);
  --border-subtle:  rgba(255,255,255,0.04);
  --border-bright:  rgba(124, 58, 237, 0.4);

  --accent:         #7c3aed;
  --accent-light:   #8b5cf6;
  --accent-glow:    rgba(124, 58, 237, 0.25);
  --cyan:           #06b6d4;
  --cyan-glow:      rgba(6, 182, 212, 0.2);
  --green:          #10b981;
  --green-glow:     rgba(16, 185, 129, 0.2);
  --yellow:         #f59e0b;
  --yellow-glow:    rgba(245, 158, 11, 0.2);
  --red:            #ef4444;
  --red-glow:       rgba(239, 68, 68, 0.2);
  --pink:           #ec4899;

  --text-primary:   #f1f0ff;
  --text-secondary: #9ca3af;
  --text-muted:     #4b5563;

  --radius-sm:  6px;
  --radius-md:  12px;
  --radius-lg:  18px;
  --radius-xl:  24px;

  --shadow-card: 0 0 0 1px var(--border), 0 8px 32px rgba(0,0,0,0.4);
  --shadow-glow: 0 0 40px var(--accent-glow);

  --sidebar-w: 240px;
  --font-head: 'Syne', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
button { cursor: pointer; font-family: var(--font-body); border: none; outline: none; }
a { text-decoration: none; color: inherit; }
input, select, textarea { font-family: var(--font-body); }
h1,h2,h3,h4,h5,h6 { font-family: var(--font-head); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg-base); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════ */
#app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
#sidebar-logo {
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border-subtle);
}
#sidebar-logo .logo-mark {
  display: flex;
  align-items: center;
  gap: 10px;
}
#sidebar-logo .logo-icon {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 20px var(--accent-glow);
  flex-shrink: 0;
}
#sidebar-logo .logo-text {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
#sidebar-logo .logo-text span { color: var(--accent-light); }
#sidebar-logo .logo-badge {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 2px;
}

#sidebar-nav {
  flex: 1;
  padding: 12px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 12px 8px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s;
  position: relative;
}
.nav-item:hover { background: var(--bg-card); color: var(--text-primary); }
.nav-item.active {
  background: rgba(124, 58, 237, 0.15);
  color: var(--accent-light);
  border: 1px solid rgba(124, 58, 237, 0.2);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--accent-light);
  border-radius: 0 3px 3px 0;
}
.nav-icon { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }

#sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border-subtle);
}
.xp-bar-wrap { margin-bottom: 8px; }
.xp-bar-header {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.xp-bar-header .level-badge {
  font-family: var(--font-head);
  font-weight: 700;
  color: var(--accent-light);
}
.xp-track {
  height: 6px;
  background: var(--bg-elevated);
  border-radius: 3px;
  overflow: hidden;
}
.xp-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent), var(--cyan));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 10px var(--accent-glow);
}
.streak-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-secondary);
}
.streak-badge .streak-fire { font-size: 14px; }

/* MOBILE OVERLAY */
#mobile-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 99;
  backdrop-filter: blur(2px);
}

/* MAIN CONTENT */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* TOPBAR */
#topbar {
  height: 60px;
  background: rgba(9, 9, 26, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
#menu-toggle {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 36px; height: 36px;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
}
#topbar-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 600;
  flex: 1;
}
.topbar-action {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.topbar-action:hover { border-color: var(--border-bright); color: var(--text-primary); }

/* PAGE */
#page {
  flex: 1;
  padding: 28px;
  overflow-y: auto;
}

/* ═══════════════════════════════════════════════════════════
   CARDS & COMPONENTS
═══════════════════════════════════════════════════════════ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all 0.2s;
}
.card:hover { border-color: var(--border-bright); background: var(--bg-card-hover); }
.card-glow { box-shadow: 0 0 30px var(--accent-glow); }

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(124,58,237,0.04), transparent);
  pointer-events: none;
}
.stat-card:hover { border-color: var(--border-bright); transform: translateY(-1px); }
.stat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.stat-body { flex: 1; }
.stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); }
.stat-value { font-family: var(--font-head); font-size: 26px; font-weight: 700; line-height: 1.2; margin: 2px 0; }
.stat-sub { font-size: 12px; color: var(--text-secondary); }
.stat-trend { font-size: 11px; font-weight: 600; }
.trend-up { color: var(--green); }
.trend-down { color: var(--red); }

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: white;
  border: none;
  box-shadow: 0 0 20px var(--accent-glow);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 30px rgba(124,58,237,0.4);
}
.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--border-bright); background: var(--bg-card-hover); }
.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text-primary); border-color: var(--border-bright); }
.btn-sm { padding: 7px 14px; font-size: 12px; }
.btn-lg { padding: 13px 28px; font-size: 15px; border-radius: var(--radius-md); }
.btn-cyan {
  background: linear-gradient(135deg, var(--cyan), #0891b2);
  color: white; border: none;
  box-shadow: 0 0 20px var(--cyan-glow);
}
.btn-cyan:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(6,182,212,0.35); }
.btn-green {
  background: linear-gradient(135deg, var(--green), #059669);
  color: white; border: none;
  box-shadow: 0 0 20px var(--green-glow);
}

/* PROGRESS */
.progress-track {
  height: 8px;
  background: var(--bg-elevated);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.progress-fill.cyan { background: linear-gradient(90deg, var(--cyan), #0891b2); }
.progress-fill.green { background: linear-gradient(90deg, var(--green), #059669); }
.progress-fill.yellow { background: linear-gradient(90deg, var(--yellow), #d97706); }
.progress-fill.red { background: linear-gradient(90deg, var(--red), #dc2626); }

/* BADGE */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}
.badge-purple { background: rgba(124,58,237,0.15); color: var(--accent-light); border: 1px solid rgba(124,58,237,0.25); }
.badge-cyan   { background: rgba(6,182,212,0.15); color: var(--cyan); border: 1px solid rgba(6,182,212,0.25); }
.badge-green  { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.25); }
.badge-red    { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.25); }

/* GRID HELPERS */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

/* SECTION HEADER */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.section-title {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.section-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* DIVIDER */
.divider { height: 1px; background: var(--border-subtle); margin: 20px 0; }

/* TOAST */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  min-width: 280px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.toast.success { border-left: 3px solid var(--green); }
.toast.error   { border-left: 3px solid var(--red); }
.toast.info    { border-left: 3px solid var(--accent); }
.toast.warning { border-left: 3px solid var(--yellow); }
@keyframes toastIn  { from { opacity:0; transform: translateX(30px); } to { opacity:1; transform: translateX(0); } }
@keyframes toastOut { from { opacity:1; transform: translateX(0); } to { opacity:0; transform: translateX(30px); } }

/* ═══════════════════════════════════════════════════════════
   DASHBOARD
═══════════════════════════════════════════════════════════ */
.dashboard-hero {
  background: linear-gradient(135deg, rgba(124,58,237,0.08) 0%, rgba(6,182,212,0.04) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 28px 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.dashboard-hero::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(124,58,237,0.15), transparent 70%);
  pointer-events: none;
}
.dashboard-hero::after {
  content: '';
  position: absolute;
  bottom: -40px; left: 40%;
  width: 150px; height: 150px;
  background: radial-gradient(circle, rgba(6,182,212,0.08), transparent 70%);
  pointer-events: none;
}
.hero-greeting { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.hero-title {
  font-family: var(--font-head);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.2;
  margin-bottom: 8px;
}
.hero-title span { color: var(--accent-light); }
.hero-desc { font-size: 14px; color: var(--text-secondary); max-width: 500px; }
.hero-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* HEATMAP */
.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(26, 1fr);
  gap: 3px;
}
.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 2px;
  background: var(--bg-elevated);
  transition: all 0.2s;
  cursor: default;
}
.heatmap-cell:hover { transform: scale(1.3); z-index: 1; position: relative; }
.heat-0 { background: var(--bg-elevated); }
.heat-1 { background: rgba(124,58,237,0.25); }
.heat-2 { background: rgba(124,58,237,0.5); }
.heat-3 { background: rgba(124,58,237,0.75); }
.heat-4 { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* LEVEL BAR */
.level-display {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--bg-elevated);
  border-radius: var(--radius-md);
}
.level-circle {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--cyan));
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 800;
  flex-shrink: 0;
  box-shadow: 0 0 20px var(--accent-glow);
}
.level-info { flex: 1; }
.level-name { font-weight: 600; font-size: 14px; }
.level-xp { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }

/* ═══════════════════════════════════════════════════════════
   MODULES
═══════════════════════════════════════════════════════════ */
.module-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.module-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--module-color, var(--accent));
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.module-card:hover {
  border-color: var(--border-bright);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.module-icon-wrap {
  width: 44px; height: 44px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  margin-bottom: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-subtle);
}
.module-name {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.module-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5; }
.module-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}
.module-progress-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }

/* ═══════════════════════════════════════════════════════════
   QUIZ ENGINE
═══════════════════════════════════════════════════════════ */
#quiz-view { max-width: 760px; margin: 0 auto; }
.quiz-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.quiz-progress-text {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.quiz-timer {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  color: var(--cyan);
  margin-left: auto;
}
.quiz-timer.warning { color: var(--yellow); border-color: var(--yellow-glow); }
.quiz-timer.danger  { color: var(--red); border-color: var(--red-glow); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.question-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 28px;
  margin-bottom: 16px;
}
.question-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.q-number {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
}
.q-text {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.q-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; font-style: italic; }

.options-grid { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  width: 100%;
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 500;
}
.option-btn:hover:not(:disabled) {
  background: var(--bg-card-hover);
  border-color: var(--border-bright);
}
.option-btn.selected {
  background: rgba(124,58,237,0.12);
  border-color: var(--accent);
  color: var(--accent-light);
}
.option-btn.correct {
  background: rgba(16,185,129,0.12);
  border-color: var(--green);
  color: var(--green);
}
.option-btn.wrong {
  background: rgba(239,68,68,0.1);
  border-color: var(--red);
  color: var(--red);
}
.option-btn:disabled { cursor: default; }
.opt-letter {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.option-btn.selected .opt-letter { background: var(--accent); color: white; }
.option-btn.correct .opt-letter  { background: var(--green); color: white; }
.option-btn.wrong .opt-letter    { background: var(--red); color: white; }

.explanation-box {
  margin-top: 16px;
  padding: 16px 18px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cyan);
  border-radius: var(--radius-md);
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  animation: fadeSlideDown 0.3s ease;
}
.explanation-box.explanation-wrong {
  background: rgba(239,68,68,0.05);
  border-color: rgba(239,68,68,0.2);
  border-left-color: var(--red);
}
.exp-header-wrong {
  color: var(--red);
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 10px;
  line-height: 1.5;
}
.exp-header-ok {
  color: var(--green);
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 8px;
}
.exp-correct-label {
  display: inline-block;
  margin-top: 6px;
  padding: 5px 12px;
  background: rgba(16,185,129,0.1);
  border: 1px solid rgba(16,185,129,0.25);
  border-radius: var(--radius-sm);
  color: var(--green);
  font-size: 13px;
  line-height: 1.6;
}
.exp-body {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.65;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
  margin-top: 8px;
}
@keyframes fadeSlideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.explanation-box strong { color: var(--text-primary); display: block; margin-bottom: 4px; }

.quiz-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  gap: 12px;
}
.quiz-score-live {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}
.quiz-score-live .val { font-weight: 700; }
.quiz-score-live .val.g { color: var(--green); }
.quiz-score-live .val.r { color: var(--red); }

/* ═══════════════════════════════════════════════════════════
   RESULTS
═══════════════════════════════════════════════════════════ */
.results-hero {
  text-align: center;
  padding: 40px 24px;
  background: linear-gradient(135deg, rgba(124,58,237,0.06), rgba(6,182,212,0.03));
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.result-score-ring {
  width: 120px; height: 120px;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  position: relative;
}
.result-score-ring svg {
  position: absolute; inset: 0;
  transform: rotate(-90deg);
}
.result-score-val {
  font-family: var(--font-head);
  font-size: 32px;
  font-weight: 800;
  position: relative;
  z-index: 1;
}
.result-score-pct {
  font-size: 13px;
  color: var(--text-secondary);
  position: relative;
  z-index: 1;
}
.results-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
.result-mini {
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-md);
  text-align: center;
}
.result-mini-val { font-family: var(--font-head); font-size: 22px; font-weight: 700; }
.result-mini-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }

/* ANSWERS REVIEW */
.answer-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  transition: border-color 0.15s;
}
.answer-row:hover { border-color: var(--border); }
.answer-status {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 1px;
}
.status-ok  { background: rgba(16,185,129,0.2); color: var(--green); }
.status-bad { background: rgba(239,68,68,0.15); color: var(--red); }
.answer-q { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.answer-detail { font-size: 12px; color: var(--text-secondary); }

/* ═══════════════════════════════════════════════════════════
   ANALYTICS
═══════════════════════════════════════════════════════════ */
.chart-container {
  position: relative;
  width: 100%;
  padding: 16px;
}
.chart-title {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ═══════════════════════════════════════════════════════════
   BADGES
═══════════════════════════════════════════════════════════ */
.badge-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px;
  text-align: center;
  transition: all 0.2s;
}
.badge-card.earned {
  border-color: rgba(245,158,11,0.3);
  background: rgba(245,158,11,0.04);
}
.badge-card:not(.earned) { opacity: 0.45; filter: grayscale(1); }
.badge-emoji { font-size: 32px; margin-bottom: 8px; display: block; }
.badge-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.badge-desc { font-size: 11px; color: var(--text-secondary); }

/* ═══════════════════════════════════════════════════════════
   EXAM MODE
═══════════════════════════════════════════════════════════ */
.exam-hero {
  text-align: center;
  padding: 48px 24px;
  max-width: 560px;
  margin: 0 auto;
}
.exam-rules {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin: 24px 0;
  text-align: left;
}
.rule-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  font-size: 13px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-subtle);
}
.rule-item:last-child { border-bottom: none; }
.rule-icon { font-size: 16px; }

/* MODULE DETAIL */
.module-detail-header {
  padding: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  margin-bottom: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
}
.module-big-icon {
  width: 64px; height: 64px;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  flex-shrink: 0;
}
.module-detail-info { flex: 1; }
.module-detail-name { font-family: var(--font-head); font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.module-detail-desc { font-size: 14px; color: var(--text-secondary); }

.quiz-mode-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
}
.quiz-mode-card:hover {
  border-color: var(--border-bright);
  background: var(--bg-card-hover);
  transform: translateX(4px);
}
.mode-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.mode-info { flex: 1; }
.mode-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
.mode-desc { font-size: 12px; color: var(--text-secondary); }

/* ═══════════════════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════════════════ */
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.animate-in { animation: fadeIn 0.3s ease forwards; }

@keyframes scaleIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
.scale-in { animation: scaleIn 0.3s ease forwards; }

@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-card) 50%, var(--bg-elevated) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

/* ═══════════════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════════════ */
@media (max-width: 900px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }
  #menu-toggle { display: flex; }
  #mobile-overlay.visible { display: block; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .results-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  #page { padding: 16px; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .quiz-actions { flex-wrap: wrap; }
  .hero-title { font-size: 22px; }
  .results-grid { grid-template-columns: repeat(2, 1fr); }
  .module-detail-header { flex-direction: column; text-align: center; }
  .dashboard-hero { padding: 20px; }
}

/* Confetti */
.confetti-piece {
  position: fixed;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
  pointer-events: none;
  z-index: 9999;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 4px; }
.tab {
  flex: 1; padding: 7px 12px;
  border-radius: 5px;
  font-size: 13px; font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

/* Chip difficulty */
.diff-easy   { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
.diff-medium { background: rgba(245,158,11,0.1); color: var(--yellow); border: 1px solid rgba(245,158,11,0.2); }
.diff-hard   { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }


</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA — QUESTION BANK (80 questions)
═══════════════════════════════════════════════════════════ */
const QUESTIONS = [
// ────────────────── INSTRUMENTS FINANCIERS ──────────────────
{id:'IF01',module:'instruments',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'une action ordinaire ?",
  opts:["Un titre de créance sur une entreprise","Un titre de propriété donnant droit aux bénéfices et au vote","Un instrument dérivé permettant d'acheter un actif","Un produit structuré à capital garanti"],
  ans:[1],
  ex:"Une action ordinaire représente une part de propriété dans une société. Elle confère à son détenteur des droits patrimoniaux (dividendes, boni de liquidation) et politiques (droit de vote en AG).",
  tags:['actions','propriété']},
{id:'IF02',module:'instruments',type:'qcm',diff:'easy',pts:10,
  q:"Quelle est la durée de vie d'un bon du Trésor (BTF) en France ?",
  opts:["Moins d'un an","Entre 1 et 5 ans","Entre 5 et 10 ans","Plus de 10 ans"],
  ans:[0],
  ex:"Les BTF (Bons du Trésor à taux Fixe) sont des instruments de court terme émis par l'Agence France Trésor avec une maturité inférieure à un an (13, 26 ou 52 semaines).",
  tags:['obligations','État']},
{id:'IF03',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un ETF (Exchange Traded Fund) ?",
  opts:["Un fonds non coté qui réplique un indice","Un fonds coté en bourse qui réplique un indice ou actif","Un produit dérivé à terme","Un compte d'épargne réglementé"],
  ans:[1],
  ex:"Un ETF est un fonds d'investissement coté en bourse qui réplique la performance d'un indice de référence. Il combine la diversification d'un OPCVM avec la liquidité d'une action.",
  tags:['ETF','fonds']},
{id:'IF04',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la différence principale entre une SICAV et un FCP ?",
  opts:["La SICAV est cotée en bourse, pas le FCP","La SICAV est dotée de la personnalité morale, pas le FCP","La SICAV est réservée aux institutionnels, pas le FCP","Le FCP est garanti en capital, pas la SICAV"],
  ans:[1],
  ex:"La SICAV (Société d'Investissement à Capital Variable) est dotée de la personnalité morale et d'un conseil d'administration. Le FCP (Fonds Commun de Placement) est une copropriété de valeurs mobilières sans personnalité morale.",
  tags:['SICAV','FCP','OPCVM']},
{id:'IF05',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Comment calcule-t-on le taux actuariel d'une obligation ?",
  opts:["Coupon annuel / Prix d'achat","Taux qui égalise la somme des flux actualisés au prix de marché","Taux de coupon multiplié par la duration","(Coupon + Plus-value) / Nombre d'années restantes"],
  ans:[1],
  ex:"Le taux actuariel (ou taux de rendement actuariel) est le taux d'actualisation qui égalise la valeur actuelle de tous les flux futurs (coupons + remboursement) au prix de marché de l'obligation.",
  tags:['obligations','rendement','taux']},
{id:'IF06',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une obligation convertible ?",
  opts:["Une obligation dont le taux d'intérêt est variable","Une obligation pouvant être transformée en actions à l'initiative du porteur","Une obligation avec option de remboursement anticipé par l'émetteur","Un bon de souscription d'obligations"],
  ans:[1],
  ex:"Une obligation convertible est un titre de créance classique qui peut être converti, à l'initiative du porteur, en actions de la société émettrice selon des conditions préalablement définies (ratio de conversion, fenêtre de conversion).",
  tags:['obligations','convertibles']},
{id:'IF07',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un billet de trésorerie ?",
  opts:["Un titre d'État émis par l'AFT","Un titre de créance négociable émis par les entreprises à court terme","Un instrument du marché monétaire émis par les banques à plus d'un an","Une obligation à coupon zéro émise par les collectivités locales"],
  ans:[1],
  ex:"Les billets de trésorerie sont des titres de créance négociables (TCN) émis par des entreprises (non bancaires) pour se financer à court terme (1 jour à 1 an). Leur montant minimum est de 150 000€.",

{id:'IF08',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un FCPR (Fonds Commun de Placement à Risques) ?",
  opts:["Un fonds investi en obligations à haut rendement","Un fonds de capital-investissement investi à ≥50% en titres non cotés","Un fonds spéculatif (hedge fund) enregistré en France","Un fonds immobilier non coté"],
  ans:[1],
  ex:"Le FCPR est un fonds de capital-investissement (private equity) qui doit être investi à hauteur d'au moins 50% en titres de sociétés non cotées ou cotées sur un marché de faible capitalisation. Il bénéficie d'avantages fiscaux spécifiques.",
  tags:['FCPR','private equity','non coté']},

// ────────────────── RÉGLEMENTATION ──────────────────
{id:'RG01',module:'reglementation',type:'qcm',diff:'easy',pts:10,
  q:"Quelle directive européenne a refondu la réglementation des marchés d'instruments financiers en 2018 ?",
  opts:["UCITS IV","MiFID II / MiFIR","AIFMD","Solvabilité II"],
  ans:[1],
  ex:"MiFID II (Markets in Financial Instruments Directive II) et MiFIR sont entrés en application le 3 janvier 2018. Ils ont réformé en profondeur la structure des marchés financiers européens et renforcé la protection des investisseurs.",
  tags:['MiFID II','directive','marchés']},
{id:'RG02',module:'reglementation',type:'qcm',diff:'easy',pts:10,

{id:'RG03',module:'reglementation',type:'qcm',diff:'medium',pts:15,

  tags:['MAR','abus de marché','délit d\'initié']},
{id:'RG04',module:'reglementation',type:'qcm',diff:'medium',pts:15,

{id:'RG05',module:'reglementation',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la transparence pré-négociation imposée par MiFID II ?",

  tags:['MiFID II','transparence','pré-négociation']},
{id:'RG06',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le passeport européen pour les sociétés de gestion ?",

  ex:"Le passeport européen permet à une société de gestion agréée dans un État membre de l'UE d'exercer ses activités dans tous les autres États membres de l'UE sans avoir à obtenir un agrément supplémentaire. Il repose sur la libre prestation de services ou la libre établissement.",

{id:'RG07',module:'reglementation',type:'qcm',diff:'hard',pts:20,

{id:'RG08',module:'reglementation',type:'qcm',diff:'hard',pts:20,

// ────────────────── CONFORMITÉ ──────────────────
{id:'CF01',module:'conformite',type:'qcm',diff:'easy',pts:10,
  q:"Quelle est la fonction du RCCI dans une société de gestion ?",
  opts:["Responsable Commercial et Clientèle Institutionnelle","Responsable de la Conformité et du Contrôle Interne","Responsable de la Comptabilité et du Contrôle des Investissements","Responsable du Contrôle des Coûts et de l'Implémentation"],
  ans:[1],
  ex:"Le RCCI (Responsable de la Conformité et du Contrôle Interne) est le garant du dispositif de conformité d'une société de gestion. Sa nomination est obligatoire et il doit être certifié AMF. Il s'assure du respect des réglementations applicables.",
  tags:['RCCI','conformité','contrôle interne']},
{id:'CF02',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le contrôle de niveau 1 dans le dispositif de contrôle interne ?",
  opts:["L'audit interne réalisé annuellement par la direction générale","Les contrôles opérationnels réalisés par les équipes elles-mêmes en continu","Le contrôle exercé par l'AMF lors de ses inspections","La revue annuelle par le commissaire aux comptes"],
  ans:[1],
  ex:"Le contrôle de niveau 1 (ou premier niveau) est réalisé par les opérationnels eux-mêmes (gérants, traders, chargés de clientèle) sur leurs propres activités. Il constitue la première ligne de défense et doit être documenté.",
  tags:['contrôle interne','niveau 1','trois lignes de défense']},
{id:'CF03',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une 'muraille de Chine' (Chinese Wall) en finance ?",
  opts:["Une restriction réglementaire sur les investissements en Chine","Des barrières d'information séparant les activités susceptibles de créer des conflits d'intérêts","Une méthode de calcul de la valeur liquidative des fonds","Un mécanisme de protection des investisseurs particuliers"],
  ans:[1],
  ex:"La muraille de Chine est un dispositif organisationnel et procédural visant à prévenir les conflits d'intérêts en empêchant la circulation d'informations confidentielles entre des départements qui pourraient en abuser (ex: département M&A et département trading).",
  tags:['muraille de Chine','conflits d\'intérêts','information privilégiée']},
{id:'CF04',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Que prévoit la loi Sapin II en matière de conformité pour les entreprises ?",
  opts:["L'obligation de tenir un registre des lobbies","L'obligation pour les grandes entreprises de mettre en place un programme anti-corruption","La réforme du code de commerce français","L'obligation de publication des rémunérations des dirigeants"],
  ans:[1],
  ex:"La loi Sapin II (2016) oblige les entreprises de plus de 500 salariés avec un CA supérieur à 100M€ à mettre en place un programme de conformité anti-corruption comprenant 8 piliers (code de conduite, cartographie des risques, formation, etc.) et à désigner un responsable de la conformité.",
  tags:['Sapin II','anti-corruption','programme conformité']},
{id:'CF05',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"À quelle fréquence une société de gestion doit-elle produire un rapport annuel de contrôle interne ?",
  opts:["Tous les 6 mois","Annuellement","Tous les 2 ans","Uniquement en cas d'incident"],
  ans:[1],
  ex:"La réglementation impose la production d'un rapport annuel de contrôle interne. Ce rapport doit décrire les contrôles effectués, les anomalies détectées et les mesures correctives prises. Il est présenté au conseil d'administration ou de surveillance.",
  tags:['rapport annuel','contrôle interne','réglementation']},
{id:'CF06',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un conflit d'intérêts en matière de services d'investissement ?",
  opts:["Un différend entre deux clients d'un même établissement","Une situation où les intérêts d'un PSI et de ses clients sont potentiellement divergents","Un désaccord entre la conformité et le commercial","Une opposition entre deux départements sur l'allocation d'une opération"],
  ans:[1],
  ex:"Un conflit d'intérêts survient quand un PSI (Prestataire de Services d'Investissement) ou l'un de ses collaborateurs a un intérêt personnel ou professionnel susceptible d'influencer défavorablement la qualité du service rendu à un client. Sa gestion est une obligation réglementaire sous MiFID II.",
  tags:['conflit d\'intérêts','MiFID II','PSI']},
{id:'CF07',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Quelle est la principale exigence de MiFID II concernant la politique de rémunération des conseillers financiers ?",
  opts:["Interdiction totale de tout commissionnement","La rémunération ne doit pas inciter à recommander des produits inadaptés au client","Obligation de rémunérer uniquement à la performance","Plafonnement des rémunérations variables à 100% du fixe"],
  ans:[1],
  ex:"MiFID II exige que la politique de rémunération soit conçue pour ne pas inciter les conseillers à agir contre l'intérêt de leurs clients. Sous le régime du conseil indépendant, les rétrocessions sont interdites. La transparence sur les rémunérations est également requise.",
  tags:['rémunération','MiFID II','conseil indépendant']},
{id:'CF08',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la 'best execution' imposée par MiFID II ?",
  opts:["L'obligation de choisir toujours le prix le plus bas","L'obligation de prendre toutes les mesures raisonnables pour obtenir le meilleur résultat possible lors de l'exécution d'ordres","L'obligation de documenter toutes les transactions","L'obligation d'utiliser uniquement les marchés réglementés"],
  ans:[1],
  ex:"La best execution (meilleure exécution) oblige les PSI à prendre toutes les mesures raisonnables pour obtenir le meilleur résultat possible pour leurs clients lors de l'exécution d'ordres, en tenant compte du prix, des coûts, de la rapidité, de la probabilité d'exécution et de la taille de l'ordre.",
  tags:['best execution','MiFID II','exécution d\'ordres']},

// ────────────────── DÉONTOLOGIE ──────────────────
{id:'DE01',module:'deontologie',type:'qcm',diff:'easy',pts:10,
  q:"En quoi consiste le délit d'initié ?",
  opts:["Utiliser des techniques de trading à haute fréquence","Effectuer des transactions sur la base d'informations privilégiées non publiques","Recommander des titres à ses clients sans les avoir analysés","Pratiquer des prix différents selon les clients"],
  ans:[1],
  ex:"Le délit d'initié (insider trading) consiste à utiliser des informations privilégiées (non publiques, précises, susceptibles d'influencer le cours) pour réaliser des transactions sur des instruments financiers. Il est interdit par MAR et sanctionné pénalement en France.",
  tags:['délit d\'initié','information privilégiée','MAR']},
{id:'DE02',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le 'front running' ?",
  opts:["Une stratégie d'investissement basée sur la tendance du marché","Passer ses propres ordres avant ceux des clients pour profiter de l'impact de ces derniers","Exécuter les ordres des clients avant l'ouverture du marché","Utiliser des algorithmes pour traiter les ordres en priorité"],
  ans:[1],
  ex:"Le front running consiste, pour un intermédiaire financier, à passer des ordres pour son propre compte ou pour un tiers en anticipant l'impact sur les cours d'un ordre client qu'il va exécuter. C'est une forme de manipulation de marché interdite par MAR.",
  tags:['front running','manipulation','abus de marché']},
{id:'DE03',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Que sont les rétrocessions de commissions en gestion de fonds ?",
  opts:["Les frais de gestion reversés aux investisseurs loyaux","Les commissions reversées par les gestionnaires aux distributeurs en contrepartie de la distribution de leurs fonds","Les remises accordées sur les frais d'entrée pour les gros investisseurs","Les intérêts compensatoires versés par les fonds suite à une erreur de valorisation"],
  ans:[1],
  ex:"Les rétrocessions sont des commissions reversées par les sociétés de gestion aux distributeurs (banques, conseillers) qui placent leurs fonds. Sous MiFID II, dans le cadre du conseil indépendant, les rétrocessions sont interdites car elles créent un conflit d'intérêts entre le conseiller et son client.",
  tags:['rétrocessions','conflits d\'intérêts','MiFID II']},
{id:'DE04',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'une liste d'initiés selon MAR ?",
  opts:["La liste des actionnaires détenant plus de 5% du capital","La liste des personnes ayant accès à des informations privilégiées que l'émetteur doit tenir","Le registre des transactions de dirigeants","La liste des opérateurs de marché agréés par l'AMF"],
  ans:[1],
  ex:"MAR impose aux émetteurs et aux PSI de tenir et de mettre à jour une liste des personnes travaillant pour eux et ayant accès à des informations privilégiées (liste d'initiés). Cette liste doit être transmise à l'AMF sur demande. Elle vise à faciliter les enquêtes sur les délits d'initiés.",
  tags:['liste initiés','MAR','information privilégiée']},
{id:'DE05',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Quelle réglementation encadre les transactions personnelles des collaborateurs de PSI ?",
  opts:["Seul le règlement intérieur de chaque entreprise","MiFID II impose des règles spécifiques sur les transactions personnelles","Le code civil uniquement","Aucune réglementation spécifique si l'employé est propriétaire des titres"],
  ans:[1],
  ex:"MiFID II et la réglementation AMF encadrent strictement les transactions personnelles des collaborateurs de PSI. Ceux-ci doivent généralement déclarer leurs ordres personnels, respecter des périodes de blocage, et s'abstenir de traiter sur des titres pour lesquels ils disposent d'informations privilégiées.",
  tags:['transactions personnelles','MiFID II','conformité']},
{id:'DE06',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la manipulation de cours selon MAR ?",
  opts:["Uniquement les actions visant à faire monter artificiellement un titre","Tout comportement visant à fixer à un niveau anormal ou artificiel le prix d'un instrument financier","Les techniques de market making légales","L'arbitrage entre différentes places boursières"],
  ans:[1],
  ex:"MAR définit la manipulation de cours comme tout comportement donnant des signaux faux ou trompeurs sur l'offre, la demande ou le prix d'un instrument financier, ou fixant à un niveau anormal ou artificiel le cours d'un instrument. Elle inclut notamment le spoofing, le layering et le painting the tape.",
  tags:['manipulation cours','MAR','abus de marché']},
{id:'DE07',module:'deontologie',type:'qcm',diff:'easy',pts:10,
  q:"Qui sont les 'initiés permanents' selon la réglementation ?",
  opts:["Les day traders professionnels actifs quotidiennement","Les dirigeants et personnes ayant régulièrement accès à des informations privilégiées en raison de leur fonction","Les investisseurs institutionnels avec plus de 5% du capital","Les membres des cellules de crise lors d'opérations financières"],
  ans:[1],
  ex:"Les initiés permanents sont des personnes (dirigeants, membres du conseil, certains salariés) qui ont accès de manière permanente et régulière à des informations privilégiées du fait de leurs fonctions. Ils sont soumis à des obligations spécifiques de déclaration de leurs transactions.",
  tags:['initiés permanents','MAR','déclaration transactions']},
{id:'DE08',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le principe de loyauté en matière de services d'investissement ?",
  opts:["L'obligation de ne conseiller que les produits de son propre groupe","L'obligation d'agir honnêtement, équitablement et professionnellement dans l'intérêt du client","L'obligation de fidéliser les clients par des programmes de récompenses","L'interdiction de démarcher la clientèle des concurrents"],
  ans:[1],
  ex:"Le principe de loyauté, pilier des règles de conduite MiFID II, exige que les PSI agissent de manière honnête, équitable et professionnelle, dans l'intérêt de leurs clients. Cela implique l'absence de conflits d'intérêts non gérés, une communication claire et la priorité donnée à l'intérêt du client.",
  tags:['loyauté','MiFID II','règles de conduite']},

// ────────────────── GESTION COLLECTIVE ──────────────────
{id:'GC01',module:'gestion_collective',type:'qcm',diff:'easy',pts:10,
  q:"Comment est calculée la valeur liquidative (VL) d'un OPCVM ?",
  opts:["Cours de clôture de l'action de référence","Actif net du fonds divisé par le nombre de parts ou actions en circulation","Prix de souscription hors droits d'entrée","Valeur comptable des actifs selon le FIFO"],
  ans:[1],
  ex:"La valeur liquidative (VL ou NAV - Net Asset Value) d'un OPCVM est obtenue en divisant la valeur totale des actifs nets du fonds (actifs - passifs) par le nombre de parts ou d'actions en circulation à la date de calcul.",
  tags:['valeur liquidative','OPCVM','VL']},
{id:'GC02',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Que réglemente la directive AIFMD ?",
  opts:["Les OPCVM harmonisés de type UCITS","Les gestionnaires de fonds d'investissement alternatifs (hedge funds, private equity, immobilier)","Les fonds de pension et régimes de retraite","Les fonds monétaires et de trésorerie"],
  ans:[1],
  ex:"AIFMD (Alternative Investment Fund Managers Directive) réglemente les gestionnaires de fonds d'investissement alternatifs (FIA), c'est-à-dire tous les fonds non couverts par la directive UCITS : hedge funds, fonds de private equity, fonds immobiliers, etc.",
  tags:['AIFMD','FIA','fonds alternatifs']},
{id:'GC03',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un fonds nourricier (feeder fund) ?",
  opts:["Un fonds qui investit 85% minimum de ses actifs dans un seul fonds maître","Un fonds qui collecte des capitaux pour les investir dans plusieurs fonds maîtres","Un fonds géré selon une stratégie income/rendement","Un fonds de fonds non réglementé"],
  ans:[0],
  ex:"Un fonds nourricier investit au moins 85% de ses actifs dans un fonds maître (master fund). La structure maître-nourricier permet une gestion centralisée tout en permettant la distribution via différents fonds nourriciers dans différents pays avec des caractéristiques adaptées.",
  tags:['fonds nourricier','maître-nourricier','OPCVM']},
{id:'GC04',module:'gestion_collective',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un FCPE ?",
  opts:["Fonds Commun de Placement en Entreprise — un OPCVM réservé aux salariés","Fonds de Couverture Pour les Entreprises","Fonds Commun de Placement Européen","Fonds de Crédit aux Petites Entreprises"],
  ans:[0],
  ex:"Le FCPE (Fonds Commun de Placement en Entreprise) est un OPCVM réservé aux salariés d'une entreprise dans le cadre de l'épargne salariale (PEE, PER collectif). Ses caractéristiques sont adaptées à ce cadre : conseil de surveillance incluant des représentants des salariés.",
  tags:['FCPE','épargne salariale','PEE']},
{id:'GC05',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la tracking error d'un fonds indiciels ?",
  opts:["L'écart entre les frais de gestion réels et budgétés","L'écart-type de la différence de performance entre le fonds et son indice de référence","Le décalage temporel entre le calcul de la VL et le cours de l'indice","L'erreur dans le calcul de la valeur liquidative"],
  ans:[1],
  ex:"La tracking error mesure la volatilité de l'écart de performance (tracking difference) entre un fonds et son indice de référence. Elle s'exprime en % annualisé. Une faible tracking error indique que le fonds réplique fidèlement son indice.",
  tags:['tracking error','gestion indicielle','ETF']},
{id:'GC06',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Quelle est la règle de concentration maximale par émetteur pour un UCITS ?",
  opts:["5% maximum par émetteur (règle 5/10/40)","10% maximum par émetteur et 20% pour les gouvernements","20% maximum par émetteur sans exception","40% maximum pour les 5 premiers émetteurs"],
  ans:[0],
  ex:"La règle de diversification UCITS (5/10/40) limite à 5% maximum l'exposition à un même émetteur, avec possibilité de monter à 10% pour certains émetteurs. L'exposition aux émetteurs dépassant 5% ne peut excéder 40% du total. Des exceptions existent pour les obligations gouvernementales.",
  tags:['UCITS','diversification','règle 5/10/40']},
{id:'GC07',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le TER (Total Expense Ratio) d'un fonds ?",
  opts:["Le taux d'exposition aux marchés actions","Le ratio de tous les frais supportés par le fonds rapportés à son actif net moyen","Le rendement total incluant les dividendes réinvestis","Le ratio de rotation du portefeuille"],
  ans:[1],
  ex:"Le TER (Total Expense Ratio) ou Ratio Total des Frais (RTF) mesure l'ensemble des frais supportés par un fonds sur une année (frais de gestion, frais administratifs, frais de dépositaire, etc.) rapportés à son actif net moyen. Il permet de comparer le coût réel entre fonds.",
  tags:['TER','frais','OPCVM']},
{id:'GC08',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'une side pocket dans un fonds ?",
  opts:["Un compartiment réservé aux investisseurs institutionnels","Un mécanisme de cantonnement des actifs illiquides pour protéger les porteurs","Une garantie en capital offerte aux souscripteurs","Un dispositif de couverture systématique du risque de change"],
  ans:[1],
  ex:"Une side pocket (ou cantonnement) est un mécanisme permettant d'isoler des actifs illiquides ou en difficulté dans un compartiment séparé. Elle protège les porteurs actifs des sorties des porteurs souhaitant racheter leurs parts, qui ne peuvent récupérer la fraction investie en side pocket qu'à la liquidation de ces actifs.",
  tags:['side pocket','illiquidité','gestion de crise']},

// ────────────────── PRODUITS DÉRIVÉS ──────────────────
{id:'PD01',module:'derives',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'une option d'achat (call) ?",
  opts:["L'obligation d'acheter un actif à un prix convenu","Le droit, sans obligation, d'acheter un actif à un prix convenu jusqu'à une date d'échéance","L'obligation de vendre un actif à un prix convenu","Un contrat d'échange de flux financiers"],
  ans:[1],
  ex:"Une option d'achat (call) donne à son acheteur le droit, mais non l'obligation, d'acheter un actif sous-jacent à un prix d'exercice (strike) déterminé, jusqu'à (option américaine) ou à (option européenne) la date d'échéance.",
  tags:['option','call','droit']},
{id:'PD02',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Que mesure le delta d'une option ?",
  opts:["La sensibilité du prix de l'option à la volatilité","La sensibilité du prix de l'option à la variation du sous-jacent","La sensibilité du prix de l'option au temps qui passe","La sensibilité du prix de l'option aux taux d'intérêt"],
  ans:[1],
  ex:"Le delta mesure la variation du prix d'une option pour une variation de 1 unité du sous-jacent. Il varie entre 0 et 1 pour un call (0 et -1 pour un put). Un delta de 0,5 signifie que si le sous-jacent monte de 1€, le call prend 0,50€.",
  tags:['delta','grecques','options']},
{id:'PD03',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la principale différence entre un contrat futures et un contrat forward ?",
  opts:["Les futures sont OTC, les forwards sont cotés en bourse","Les futures sont standardisés et cotés, les forwards sont OTC et personnalisables","Les futures expirent après 1 an maximum, pas les forwards","Les forwards nécessitent un dépôt de garantie, pas les futures"],
  ans:[1],
  ex:"Les futures sont des contrats standardisés négociés sur des marchés organisés, avec chambres de compensation (appels de marge quotidiens). Les forwards sont des contrats sur mesure négociés de gré à gré (OTC), sans chambre de compensation, exposant les parties au risque de contrepartie.",
  tags:['futures','forwards','OTC','marché organisé']},
{id:'PD04',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un swap de taux d'intérêt vanille (IRS vanilla) ?",
  opts:["Un échange de devises entre deux contreparties","Un échange de flux : taux fixe contre taux variable sur un nominal notionnel","Un contrat à terme sur obligations d'État","Une option sur taux d'intérêt"],
  ans:[1],
  ex:"Un IRS (Interest Rate Swap) vanille est un contrat d'échange dans lequel une contrepartie verse un taux fixe et reçoit un taux variable (ex: Euribor 3M) sur un nominal notionnel et sur une durée définie. Seuls les flux nets sont échangés, pas le nominal.",
  tags:['IRS','swap de taux','OTC']},
{id:'PD05',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Comment se décompose la valeur d'une option ?",
  opts:["Valeur de temps + Prime de risque","Valeur intrinsèque + Valeur temps","Valeur actuelle + Valeur résiduelle","Delta × Prime + Thêta × Durée"],
  ans:[1],
  ex:"La valeur d'une option = Valeur intrinsèque + Valeur temps. La valeur intrinsèque est le gain immédiat si l'option est exercée maintenant (max(S-K,0) pour un call). La valeur temps reflète la probabilité que l'option gagne en valeur avant l'échéance.",
  tags:['valeur option','valeur intrinsèque','valeur temps']},
{id:'PD06',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un Credit Default Swap (CDS) ?",
  opts:["Un contrat d'échange de taux d'intérêt contre protection credit","Un instrument de protection contre le risque de défaut d'un émetteur","Un swap liant deux devises avec protection inflation","Un produit structuré à capital garanti indexé sur le crédit"],
  ans:[1],
  ex:"Un CDS est un dérivé de crédit : l'acheteur de protection verse une prime périodique (spread) à un vendeur de protection, qui s'engage à indemniser l'acheteur si un événement de crédit (défaut, restructuration...) survient sur l'entité de référence. C'est une forme d'assurance contre le risque de crédit.",
  tags:['CDS','dérivés de crédit','risque de contrepartie']},
{id:'PD07',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Quel est le risque principal d'une vente de put nu (naked short put) ?",
  opts:["Perte limitée à la prime encaissée","Perte potentiellement très importante si le sous-jacent s'effondre","Gain illimité si le sous-jacent monte","Risque de livraison physique du sous-jacent uniquement"],
  ans:[1],
  ex:"Un vendeur de put nu (sans position courte sur le sous-jacent) est exposé à une perte maximale = Strike - Prime encaissée. Si le sous-jacent tombe à 0, la perte est quasiment égale au strike. Ce risque est considéré comme très élevé et nécessite des appels de marge importants.",
  tags:['put nu','risque','vente d\'option']},
{id:'PD08',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Que prévoit le règlement EMIR pour les dérivés OTC ?",
  opts:["L'interdiction des dérivés OTC en Europe","La compensation centrale obligatoire et le reporting des dérivés OTC","L'obligation de coter tous les dérivés sur des marchés réglementés","La suppression du risque de contrepartie par l'État"],
  ans:[1],
  ex:"EMIR (European Market Infrastructure Regulation) impose pour les dérivés OTC standardisés : la compensation via des contreparties centrales (CCP), des exigences de collatéral pour les non-compensés centralement, et le reporting de toutes les transactions à des référentiels centraux.",
  tags:['EMIR','dérivés OTC','compensation centrale']},

// ────────────────── MARCHÉS FINANCIERS ──────────────────
{id:'MF01',module:'marches',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un marché réglementé selon MiFID II ?",
  opts:["Tout marché sur lequel s'appliquent des règles de trading","Un système multilatéral géré par un opérateur soumis à agrément, admettant des instruments selon des règles strictes","Un marché OTC sur lequel les prix sont fixés bilatéralement","Un marché réservé aux investisseurs institutionnels"],
  ans:[1],
  ex:"Un marché réglementé (MR) est un système multilatéral exploité par un opérateur agréé, qui réunit des intérêts acheteurs et vendeurs d'instruments financiers selon des règles non discrétionnaires. Euronext Paris est le principal marché réglementé français.",
  tags:['marché réglementé','MiFID II','Euronext']},
{id:'MF02',module:'marches',type:'qcm',diff:'easy',pts:10,
  q:"Quel est le délai standard de règlement-livraison des actions en Europe (T+?) ?",
  opts:["T+1","T+2","T+3","T+5"],
  ans:[1],
  ex:"Le cycle de règlement-livraison standard en Europe pour les actions est T+2 (2 jours ouvrés après la transaction). La migration vers T+1 est à l'étude en Europe, dans le sillage des États-Unis qui sont passés à T+1 en 2024.",
  tags:['règlement-livraison','T+2','post-marché']},
{id:'MF03',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la différence principale entre un MTF et un marché réglementé ?",
  opts:["Le MTF est réservé aux obligations, le MR aux actions","Le MTF est moins réglementé en matière d'admission des titres, même si les règles de trading sont similaires","Le MTF permet le trading 24h/24 contrairement au MR","Le MTF n'est pas supervisé par l'AMF"],
  ans:[1],
  ex:"Un MTF (Multilateral Trading Facility / Système Multilatéral de Négociation) fonctionne selon des règles similaires à un MR pour l'exécution des ordres, mais avec des critères d'admission des instruments moins stricts. Euronext Growth Paris est un MTF. Un MTF est agrée et supervisé.",
  tags:['MTF','SMN','marché réglementé']},
{id:'MF04',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la fonction d'un teneur de marché (market maker) ?",
  opts:["Surveiller le respect des règles de marché","Afficher en permanence des prix acheteurs et vendeurs pour assurer la liquidité","Centraliser les ordres des investisseurs institutionnels","Exécuter les transactions des investisseurs particuliers"],
  ans:[1],
  ex:"Un teneur de marché (market maker) s'engage contractuellement à afficher en continu des cotations à l'achat (bid) et à la vente (ask) pour certains instruments financiers, assurant ainsi la liquidité du marché. Sa rémunération provient du spread entre prix acheteur et vendeur.",
  tags:['teneur de marché','liquidité','market making']},
{id:'MF05',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Que prévoit le règlement SSR (Short Selling Regulation) de l'UE ?",
  opts:["L'interdiction totale des ventes à découvert en Europe","La transparence sur les positions courtes nettes et pouvoirs d'intervention des régulateurs en cas de perturbation","L'obligation de détenir les titres avant de les vendre","La supervision du prêt de titres par la BCE"],
  ans:[1],
  ex:"Le SSR (Short Selling Regulation UE 236/2012) impose la divulgation des positions courtes nettes significatives à l'AMF (et à l'ESMA pour les plus importantes), interdit les ventes à découvert nues sur actions et CDS souverains, et donne aux régulateurs des pouvoirs d'intervention temporaire.",
  tags:['SSR','vente à découvert','positions courtes']},
{id:'MF06',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un circuit breaker boursier ?",
  opts:["Un algorithme de trading haute fréquence","Un mécanisme automatique de suspension temporaire des transactions en cas de volatilité extrême","Un système de garantie des ordres à cours limité","Un dispositif de contrôle des risques opérationnels"],
  ans:[1],
  ex:"Les circuit breakers sont des mécanismes automatiques qui déclenchent une suspension temporaire des transactions lorsque le cours d'un titre (ou d'un indice) varie au-delà d'un seuil défini sur une période courte. Ils visent à permettre aux marchés de se stabiliser lors d'épisodes de volatilité extrême.",
  tags:['circuit breaker','volatilité','mécanismes de marché']},
{id:'MF07',module:'marches',type:'qcm',diff:'easy',pts:10,
  q:"Sur quelle plateforme sont principalement cotées les grandes entreprises françaises ?",
  opts:["Paris Bourse SBF SA","Euronext Paris","Alternext France","NYSE Euronext Europe"],
  ans:[1],
  ex:"Euronext Paris est le principal marché réglementé français. Il est exploité par Euronext N.V. et accueille notamment les entreprises de l'indice CAC 40 ainsi que les autres compartiments (A, B, C selon la capitalisation).",
  tags:['Euronext Paris','marché réglementé','CAC 40']},
{id:'MF08',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Qu'impose la directive Transparence aux émetteurs cotés ?",
  opts:["La publication hebdomadaire des carnets d'ordres","La publication d'informations périodiques (rapports semestriel, annuel) et d'informations permanentes (franchissements de seuils)","L'interdiction de détenir des autocontrôles","La séparation des activités de conseil et d'investissement"],
  ans:[1],
  ex:"La directive Transparence (2004/109/CE, modifiée) impose aux émetteurs dont les titres sont admis sur un MR de publier des informations périodiques (rapport financier annuel, rapport semestriel) et permanentes (informations réglementées : faits importants, franchissements de seuils de détention, transactions des dirigeants).",
  tags:['directive Transparence','informations réglementées','émetteurs']},

// ────────────────── ESG ──────────────────
{id:'ES01',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un fonds Article 9 selon SFDR ?",
  opts:["Un fonds qui promeut des caractéristiques ESG","Un fonds qui a un investissement durable pour objectif central","Un fonds qui exclut seulement les secteurs controversés","Un fonds qui intègre les risques de durabilité dans son processus"],
  ans:[1],
  ex:"Selon SFDR (Sustainable Finance Disclosure Regulation), les fonds Article 9 ('dark green') ont l'investissement durable comme objectif principal. Ils vont plus loin que les fonds Article 8 (qui 'promeuvent' des caractéristiques ESG) et doivent démontrer que leurs investissements contribuent à un objectif environnemental ou social.",
  tags:['SFDR','Article 9','investissement durable']},
{id:'ES02',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Combien d'objectifs environnementaux définit la taxonomie verte de l'UE ?",
  opts:["4 objectifs","6 objectifs","8 objectifs","10 objectifs"],
  ans:[1],
  ex:"La taxonomie de l'UE définit 6 objectifs environnementaux : (1) atténuation du changement climatique, (2) adaptation au changement climatique, (3) utilisation durable des ressources aquatiques, (4) économie circulaire, (5) prévention de la pollution, (6) protection des écosystèmes. Une activité est 'verte' si elle contribue à au moins un objectif sans nuire aux autres (DNSH).",
  tags:['taxonomie UE','objectifs environnementaux','DNSH']},
{id:'ES03',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la 'double matérialité' au sens de la directive CSRD ?",
  opts:["L'obligation de publier deux rapports ESG distincts","La prise en compte simultanée des risques ESG sur l'entreprise ET des impacts de l'entreprise sur la société et l'environnement","L'évaluation des risques ESG par deux agences de notation indépendantes","La double vérification obligatoire des données ESG par un auditeur externe"],
  ans:[1],
  ex:"La CSRD (Corporate Sustainability Reporting Directive) impose une approche de double matérialité : les entreprises doivent reporter sur (1) comment les questions de durabilité affectent leur performance financière (matérialité financière / outside-in), ET (2) comment leurs activités impactent les personnes et l'environnement (matérialité d'impact / inside-out).",
  tags:['CSRD','double matérialité','reporting durabilité']},
{id:'ES04',module:'esg',type:'qcm',diff:'hard',pts:20,
  q:"Que sont les PAI (Principal Adverse Impacts) selon SFDR ?",
  opts:["Les activités présentant un risque de défaut principal","Les principaux impacts négatifs des décisions d'investissement sur les facteurs de durabilité","Les agences de notation ESG prioritaires à consulter","Les ajustements comptables liés à la comptabilisation des risques climatiques"],
  ans:[1],
  ex:"Les PAI (Principal Adverse Impacts / Principales Incidences Négatives) sont les effets négatifs les plus importants que les décisions d'investissement peuvent avoir sur des facteurs environnementaux, sociaux et de gouvernance. SFDR impose aux grands gestionnaires de publier une déclaration PAI annuelle avec des indicateurs standardisés.",
  tags:['PAI','SFDR','impacts négatifs']},
{id:'ES05',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le greenwashing dans le contexte financier ?",
  opts:["L'investissement dans des entreprises liées au secteur vert","Présenter faussement des produits financiers comme plus durables qu'ils ne le sont","La conversion d'un portefeuille conventionnel vers l'ESG","L'utilisation d'énergies renouvelables par les sociétés de gestion"],
  ans:[1],
  ex:"Le greenwashing (éco-blanchiment) consiste pour un émetteur ou un gestionnaire à surestimer ou tromper sur les qualités environnementales, sociales ou de gouvernance d'un produit ou d'une stratégie. Il est dans le viseur des régulateurs (ESMA, AMF) qui renforcent les exigences de transparence et de preuve.",
  tags:['greenwashing','ESG','SFDR']},
{id:'ES06',module:'esg',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que le label ISR en France ?",
  opts:["Un label d'État pour les fonds intégrant des critères ESG dans leur gestion","Un label européen pour les obligations vertes","Une certification réservée aux gérants de portefeuille ESG","Un standard comptable pour les entreprises durables"],
  ans:[0],
  ex:"Le label ISR (Investissement Socialement Responsable) est un label public français créé en 2016, attribué par des organismes accrédités à des fonds intégrant des critères ESG dans leur gestion. Le référentiel a été révisé en 2024 pour renforcer les critères d'exclusion climatique.",
  tags:['label ISR','ESG France','investissement responsable']},
{id:'ES07',module:'esg',type:'qcm',diff:'easy',pts:10,
  q:"À quel ODD des Nations Unies correspond l'action climatique ?",
  opts:["ODD 7 — Énergie propre","ODD 11 — Villes durables","ODD 13 — Lutte contre les changements climatiques","ODD 15 — Vie terrestre"],
  ans:[2],
  ex:"L'ODD 13 'Mesures relatives à la lutte contre les changements climatiques' appelle à prendre d'urgence des mesures pour lutter contre les changements climatiques et leurs répercussions. Il est au cœur des stratégies d'investissement ESG orientées changement climatique.",
  tags:['ODD','ODD 13','changement climatique']},
{id:'ES08',module:'esg',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une obligation verte (green bond) ?",
  opts:["Une obligation émise par des États considérés écologiques","Une obligation dont les fonds sont exclusivement affectés à des projets environnementaux","Un bon d'État à taux zéro pour financer la transition énergétique","Une obligation dont le coupon est lié à des indicateurs ESG"],
  ans:[1],
  ex:"Une green bond (obligation verte) est un instrument de dette dont les fonds levés sont exclusivement utilisés pour financer des projets ayant des bénéfices environnementaux. Les Principes Green Bond (ICMA) et la norme EU Green Bond Standard fournissent le cadre de référence.",
  tags:['green bonds','finance durable','obligations']},

// ────────────────── LCB-FT ──────────────────
{id:'LB01',module:'lcbft',type:'qcm',diff:'easy',pts:10,
  q:"Que signifie KYC dans le contexte de la LCB-FT ?",
  opts:["Keep Your Compliance","Know Your Customer — Connaissance du client","Key Yield Certificate","Know Your Counterparty"],
  ans:[1],
  ex:"KYC (Know Your Customer / Connaissance du Client) désigne l'ensemble des procédures permettant à un établissement financier d'identifier et de vérifier l'identité de ses clients, de comprendre leur situation patrimoniale et l'objet de la relation d'affaires, dans le cadre de la lutte contre le blanchiment.",
  tags:['KYC','LCB-FT','identification client']},
{id:'LB02',module:'lcbft',type:'qcm',diff:'easy',pts:10,
  q:"À qui les PSI doivent-ils transmettre leurs déclarations de soupçon en France ?",
  opts:["À la Direction Générale du Trésor","À TRACFIN (Traitement du renseignement et action contre les circuits financiers clandestins)","Au Parquet national financier (PNF)","À la Commission Nationale des Sanctions (CNS)"],
  ans:[1],
  ex:"TRACFIN est la cellule de renseignement financier française, rattachée au Ministère de l'Économie. Les organismes assujettis (PSI, établissements de crédit, assureurs, notaires...) ont l'obligation de lui déclarer les sommes dont ils savent, soupçonnent ou ont de bonnes raisons de soupçonner qu'elles proviennent d'une infraction ou sont destinées au financement du terrorisme.",
  tags:['TRACFIN','déclaration de soupçon','LCB-FT']},
{id:'LB03',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une Personne Politiquement Exposée (PPE) ?",
  opts:["Un client disposant d'un patrimoine supérieur à 1M€","Une personne occupant ou ayant récemment occupé une fonction publique importante, exposée à des risques de corruption","Un employé d'un PSI ayant accès à des informations stratégiques","Un actionnaire de référence d'une société cotée"],
  ans:[1],
  ex:"Une PPE (Politically Exposed Person) est une personne occupant ou ayant occupé (dans les 12 mois précédents) des fonctions publiques importantes : chef d'État, ministre, haut magistrat, dirigeant d'entreprise publique, etc. Les PSI doivent appliquer une vigilance renforcée à ces clients en raison des risques élevés de corruption.",
  tags:['PPE','vigilance renforcée','LCB-FT']},
{id:'LB04',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Dans quel cas peut-on appliquer une vigilance simplifiée pour la LCB-FT ?",
  opts:["Pour tout client présentant un faible risque selon l'évaluation nationale des risques","Pour les fonds monétaires et produits d'assurance à faible risque identifiés","Pour les entreprises du CAC 40 uniquement","Pour les clients dont le patrimoine est inférieur à 500 000€"],
  ans:[1],
  ex:"La vigilance simplifiée peut être appliquée pour certaines catégories de clients ou de produits présentant un risque intrinsèquement faible (ex: certains fonds monétaires, produits d'assurance avec rachat limité, clients cotés sur MR européen...). La liste est définie par la réglementation et doit être justifiée dans l'évaluation des risques.",
  tags:['vigilance simplifiée','LCB-FT','approche par les risques']},
{id:'LB05',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'une déclaration de soupçon en LCB-FT ?",
  opts:["Un rapport annuel sur les opérations suspectes","L'obligation de signaler à TRACFIN toute opération dont on soupçonne qu'elle est liée au blanchiment ou au financement du terrorisme","La notification aux autorités de toute transaction supérieure à 10 000€","Un formulaire mensuel récapitulant les opérations atypiques"],
  ans:[1],
  ex:"La déclaration de soupçon (DS) est une obligation légale pour les assujettis LCB-FT. Elle doit être transmise à TRACFIN dès que l'assujetti sait, soupçonne ou a de bonnes raisons de soupçonner qu'une somme ou une opération est liée à du blanchiment ou du financement du terrorisme. Le seuil n'est pas uniquement le montant mais l'ensemble des éléments contextuels.",
  tags:['déclaration de soupçon','TRACFIN','obligation légale']},
{id:'LB06',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que l'infraction de 'tipping off' en LCB-FT ?",
  opts:["Le fait d'informer le client qu'une déclaration de soupçon a été transmise à TRACFIN","Une technique de structuration des transactions pour éviter les contrôles","Le fait de fractionner les opérations pour passer sous les seuils de déclaration","L'obligation de signalement aux autorités pour les transactions en espèces"],
  ans:[0],
  ex:"Le tipping off consiste à informer le client (ou un tiers) qu'une déclaration de soupçon le concernant a été ou va être faite à TRACFIN. Cette pratique est formellement interdite et constitue une infraction pénale, car elle pourrait permettre au suspect de faire disparaître des preuves ou de fuir.",
  tags:['tipping off','TRACFIN','infraction']},
{id:'LB07',module:'lcbft',type:'qcm',diff:'medium',pts:15,
  q:"Quel est le rôle du GAFI (Groupe d'Action Financière) ?",
  opts:["Superviser les banques centrales mondiales","Définir les normes internationales de lutte contre le blanchiment et financement du terrorisme","Agréer les PSI dans les pays de l'OCDE","Gérer les sanctions économiques internationales"],
  ans:[1],
  ex:"Le GAFI (FATF en anglais) est un organisme intergouvernemental fondé en 1989 qui définit les normes internationales de LCB-FT. Il évalue la conformité des pays à ses recommandations (40 recommandations) et publie des listes de pays à risques (liste grise et liste noire).",
  tags:['GAFI','FATF','normes internationales LCB-FT']},
{id:'LB08',module:'lcbft',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le bénéficiaire effectif (UBO — Ultimate Beneficial Owner) ?",
  opts:["Le dernier bénéficiaire d'un contrat d'assurance-vie","La personne physique qui, en dernier lieu, détient ou contrôle une entité juridique à plus de 25%","Le mandataire légal représentant l'entreprise cliente","Le signataire autorisé d'une entreprise"],
  ans:[1],
  ex:"Le bénéficiaire effectif (UBO) est la personne physique qui, en dernier ressort, détient (directement ou indirectement, généralement >25%) ou contrôle une entité juridique, ou pour le compte de laquelle une transaction est effectuée. Son identification est obligatoire dans le KYC des personnes morales.",
  tags:['UBO','bénéficiaire effectif','KYC personnes morales']},

// ────────────────── RELATION CLIENT ──────────────────
{id:'RC01',module:'relation_client',type:'qcm',diff:'easy',pts:10,
  q:"Quelles sont les 3 catégories de clients selon MiFID II ?",
  opts:["Petit, moyen et grand investisseur","Client non professionnel, client professionnel, contrepartie éligible","Client retail, client VIP, client institutionnel","Investisseur particulier, investisseur qualifié, investisseur accrédité"],
  ans:[1],
  ex:"MiFID II distingue 3 catégories : (1) Clients non professionnels (retail) — protection maximale, (2) Clients professionnels — ex: institutions financières, grandes entreprises, réduction des obligations ; (3) Contreparties éligibles — ex: banques, assureurs, niveau de protection minimum pour les transactions entre professionnels.",
  tags:['catégorisation','MiFID II','clients']},
{id:'RC02',module:'relation_client',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le test d'adéquation (suitability test) imposé par MiFID II ?",
