  opts:["Un test de connaissance que le client doit réussir avant d'investir","L'évaluation par le PSI des connaissances, objectifs, tolérance au risque et situation financière du client avant de formuler une recommandation","Un questionnaire rempli annuellement par le client pour vérifier ses qualifications","La vérification que le produit proposé est dans le meilleur intérêt de l'entreprise"],
  ans:[1],
  ex:"Le test d'adéquation (suitability) est obligatoire pour le service de conseil en investissement et de gestion de portefeuille. Le PSI doit recueillir les informations sur les connaissances, l'expérience, la situation financière, la tolérance au risque et les objectifs du client pour vérifier que la recommandation lui est adaptée.",
  tags:['test adéquation','suitability','MiFID II']},
{id:'RC03',module:'relation_client',type:'qcm',diff:'easy',pts:10,
  q:"Quand doit être remis le DICI (Document d'Informations Clés pour l'Investisseur) ?",
  opts:["Après la souscription pour confirmation","Avant la souscription, en temps utile","Dans les 30 jours suivant la souscription","Uniquement si le client en fait la demande explicite"],
  ans:[1],
  ex:"Le DICI (KID/KIID selon les produits) doit être remis gratuitement au client avant toute souscription d'OPCVM/fonds, en temps utile pour lui permettre de prendre une décision éclairée. Il présente en 2 pages les informations clés : objectifs, risques, performances passées, frais.",
  tags:['DICI','KIID','document information']},
{id:'RC04',module:'relation_client',type:'qcm',diff:'medium',pts:15,
  q:"Quel est le délai de rétractation pour un contrat de démarchage financier en France ?",
  opts:["7 jours calendaires","14 jours calendaires","30 jours ouvrés","Aucun droit de rétractation en matière financière"],
  ans:[1],
  ex:"En cas de démarchage financier, la personne démarchée dispose d'un délai de 14 jours calendaires pour se rétracter, à compter du lendemain de la signature du contrat ou de la réception des fonds. Pendant ce délai, aucun paiement ou contrepartie ne peut être exigé.",
  tags:['démarchage','rétractation','14 jours']},
{id:'RC05',module:'relation_client',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le démarchage financier selon la loi française ?",
  opts:["Toute communication commerciale par email ou téléphone","La prise de contact non sollicitée en vue de fournir des services financiers ou recueillir des souscriptions","La publicité financière dans les médias","Les offres promotionnelles sur les produits financiers"],
  ans:[1],
  ex:"Le démarchage financier est défini comme la prise de contact non sollicitée, par quelque moyen que ce soit (téléphone, physique, internet...) avec une personne en vue de lui fournir des services d'investissement ou de recueillir son adhésion. Il est strictement encadré et seules certaines entités agréées peuvent démarcher.",
  tags:['démarchage financier','contact non sollicité','réglementation']},
{id:'RC06',module:'relation_client',type:'qcm',diff:'medium',pts:15,
  q:"Dans quel délai maximal un PSI doit-il répondre à une réclamation d'un client non professionnel ?",
  opts:["1 mois","2 mois","3 mois","6 mois"],
  ans:[1],
  ex:"Selon la réglementation française (arrêté du 26 juin 2018), les PSI doivent accuser réception de toute réclamation sous 10 jours ouvrables et apporter une réponse dans un délai de 2 mois maximum à compter de la réception. Pour les réclamations complexes, ce délai peut être justifié.",
  tags:['réclamation','2 mois','PSI']},
{id:'RC07',module:'relation_client',type:'qcm',diff:'hard',pts:20,
  q:"Comment un client non professionnel peut-il demander à être re-catégorisé en client professionnel sur demande ?",
  opts:["En remplissant un formulaire AMF en ligne","En remplissant deux des trois critères quantitatifs définis par MiFID II et en renoncant formellement à certaines protections","En justifiant d'une expérience professionnelle de 5 ans dans la finance","En obtenant la certification AMF"],
  ans:[1],
  ex:"Un client non professionnel peut demander à être traité comme un client professionnel (opt-up) s'il remplit au moins 2 des 3 critères : (1) ≥10 transactions de taille significative par trimestre sur 4 trimestres, (2) portefeuille > 500 000€, (3) expérience professionnelle ≥1 an dans la finance. Il doit formellement renoncer à certaines protections.",
  tags:['re-catégorisation','opt-up','client professionnel']},
{id:'RC08',module:'relation_client',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le test d'appropriation (appropriateness test) par rapport au test d'adéquation ?",
  opts:["Ce sont deux noms pour le même test","Le test d'appropriation s'applique aux services non-conseil (réception-transmission d'ordres) et évalue uniquement les connaissances et l'expérience","Le test d'appropriation est plus complet car il inclut la situation financière","Le test d'appropriation n'est obligatoire que pour les dérivés"],
  ans:[1],
  ex:"Le test d'appropriation s'applique aux services de simple exécution et de RTO (hors conseil). Il évalue uniquement les connaissances et l'expérience du client pour déterminer si le service ou l'instrument est approprié. À la différence du test d'adéquation, il ne requiert pas la collecte de données sur la situation financière et les objectifs.",
  tags:['test appropriation','appropriateness','MiFID II']},

// ──────────── INSTRUMENTS FINANCIERS (suite) ────────────
{id:'IF09',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un crypto-actif selon le règlement MiCA ?",
  opts:["Un instrument financier numérique émis par une banque centrale","Une représentation numérique d'une valeur ou d'un droit transférable via DLT/blockchain","Un titre de créance dématérialisé émis par une fintech","Un produit dérivé dont le sous-jacent est une devise numérique"],
  ans:[1],
  ex:"MiCA (Markets in Crypto-Assets Regulation, applicable depuis 2024) définit les crypto-actifs comme des représentations numériques d'une valeur ou d'un droit, pouvant être émises, stockées et transférées via des technologies de registre distribué (DLT/blockchain). MiCA exclut les instruments financiers déjà couverts par MiFID II.",
  tags:['crypto-actifs','MiCA','DLT']},
{id:'IF10',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Quelle est la différence principale entre un stablecoin et le bitcoin ?",
  opts:["Le stablecoin est émis par une banque centrale, le bitcoin par des mineurs","Le stablecoin est adossé à un actif de référence pour stabiliser sa valeur, le bitcoin fluctue librement","Le bitcoin est réglementé par la BCE, pas le stablecoin","Le stablecoin peut être échangé sur marchés réglementés, pas le bitcoin"],
  ans:[1],
  ex:"Un stablecoin est conçu pour maintenir une valeur stable en étant adossé à une monnaie fiduciaire (ex: USDC indexé sur le dollar) ou à d'autres actifs. Le bitcoin fluctue selon l'offre et la demande, sans adossement à un actif réel.",
  tags:['stablecoin','bitcoin','crypto-actifs']},
{id:'IF11',module:'instruments',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un certificat de dépôt ?",
  opts:["Un titre de propriété foncière","Un titre de créance négociable émis exclusivement par les établissements de crédit à court terme","Un produit d'épargne réglementé garanti par l'État","Un titre hybride entre action et obligation"],
  ans:[1],
  ex:"Le certificat de dépôt est un titre de créance négociable (TCN) émis exclusivement par les établissements de crédit, d'une durée de 1 jour à 1 an. Il permet aux banques de se refinancer à court terme auprès d'investisseurs institutionnels. Son montant minimum est de 150 000 €.",
  tags:['certificat de dépôt','TCN','court terme']},
{id:'IF12',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Que mesure la duration modifiée d'une obligation ?",
  opts:["Le nombre d'années restant jusqu'à l'échéance","La sensibilité du prix de l'obligation à une variation de 1 % des taux d'intérêt","Le délai moyen de récupération des flux actualisés","La durée de vie résiduelle pondérée par les coupons"],
  ans:[1],
  ex:"La duration modifiée (D*) = Duration Macaulay / (1+r). Elle mesure la sensibilité du prix : une duration modifiée de 5 signifie qu'une hausse de 1 % des taux entraîne une baisse d'environ 5 % du prix. C'est l'outil clé de gestion du risque de taux obligataire.",
  tags:['duration','sensibilité','obligations','risque de taux']},
{id:'IF13',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un EMTN (Euro Medium Term Note) ?",
  opts:["Un bon d'État européen à taux fixe","Un programme d'émission cadre permettant d'émettre régulièrement des obligations à moyen terme","Un certificat de dépôt interbancaire européen","Un fonds obligataire de la BCE"],
  ans:[1],
  ex:"Un EMTN est un programme cadre permettant à un émetteur (État, entreprise, banque) d'émettre de façon flexible et répétée des obligations de maturité variable (1 à 30 ans). C'est l'instrument dominant des émissions obligataires institutionnelles en Europe.",
  tags:['EMTN','obligations','programme émission']},
{id:'IF14',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Comment fonctionne un produit structuré à capital garanti ?",
  opts:["C'est une obligation d'État sans risque","Combinaison d'une obligation zéro coupon (protection du capital) et d'une option (participation à la hausse d'un sous-jacent)","Un fonds d'investissement avec garantie de performance minimale","Un dépôt bancaire rémunéré à taux variable"],
  ans:[1],
  ex:"Un produit structuré à capital garanti combine : une obligation zéro coupon (qui assure le remboursement du capital à l'échéance) et une option sur un sous-jacent (indice, panier d'actions) permettant de participer à la hausse. L'investisseur est protégé contre la perte en capital mais sa participation à la hausse est limitée.",
  tags:['produit structuré','capital garanti','option']},
{id:'IF15',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un warrant ?",
  opts:["Un bon de souscription d'actions émis par une société","Un produit à effet de levier donnant le droit d'acheter ou vendre un actif à un prix fixé, émis par un établissement financier","Un certificat représentatif d'actions étrangères","Un titre de créance subordonné"],
  ans:[1],
  ex:"Un warrant est un titre coté en bourse émis par un établissement financier, donnant le droit (non l'obligation) d'acheter (call warrant) ou de vendre (put warrant) un actif sous-jacent à un prix d'exercice défini. Contrairement aux options standardisées, les warrants sont émis par des banques.",
  tags:['warrant','produit levier','droit']},
{id:'IF16',module:'instruments',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un dividende ?",
  opts:["Le coupon annuel versé par une obligation","La quote-part des bénéfices distribuée aux actionnaires par décision de l'assemblée générale","Le remboursement partiel du capital d'une action","Le droit de vote attaché à chaque action"],
  ans:[1],
  ex:"Un dividende est la part des bénéfices d'une société distribuée à ses actionnaires. Son versement est décidé par l'Assemblée Générale Ordinaire (AGO), sur proposition du conseil d'administration. Une société n'a pas l'obligation de distribuer des dividendes.",
  tags:['dividende','actions','AG']},
{id:'IF17',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un CLO (Collateralised Loan Obligation) ?",
  opts:["Un dépôt garanti par la Banque de France","Un titre de créance structuré adossé à un portefeuille de prêts, divisé en tranches de risque croissant","Un contrat de prêt collatéralisé entre banques","Un produit d'assurance-crédit pour les PME"],
  ans:[1],
  ex:"Un CLO est un produit de titrisation adossé à un portefeuille de prêts bancaires. Le portefeuille est restructuré en tranches (senior, mezzanine, equity) de risque et de rendement croissants. Les CDO adossés à des crédits hypothécaires ont été au cœur de la crise de 2008.",
  tags:['CLO','titrisation','tranches']},
{id:'IF18',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une SCPI ?",
  opts:["Une SCI familiale d'investissement immobilier","Un organisme de placement collectif investi en immobilier locatif, permettant aux particuliers d'accéder à l'investissement immobilier professionnel","Un fonds indiciel répliquant les indices immobiliers","Une société foncière cotée en bourse"],
  ans:[1],
  ex:"La SCPI (Société Civile de Placement Immobilier) est un OPC non coté dont l'actif est principalement composé d'immeubles locatifs. Elle permet aux particuliers d'investir indirectement dans l'immobilier professionnel (bureaux, commerces) avec un ticket d'entrée réduit et une gestion déléguée.",
  tags:['SCPI','immobilier','OPC']},
{id:'IF19',module:'instruments',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le risque de contrepartie ?",
  opts:["Le risque que l'émetteur d'une obligation fasse défaut sur ses paiements","Le risque qu'une contrepartie d'un contrat financier ne remplisse pas ses obligations","Le risque de variation adverse des taux d'intérêt","Le risque de manque de liquidité sur un marché"],
  ans:[1],
  ex:"Le risque de contrepartie est le risque qu'une contrepartie dans une transaction financière (particulièrement OTC) ne puisse pas honorer ses engagements. Il est atténué par l'utilisation de chambres de compensation (CCP) qui s'interposent entre acheteur et vendeur.",
  tags:['risque contrepartie','risque crédit','OTC','CCP']},
{id:'IF20',module:'instruments',type:'qcm',diff:'hard',pts:20,
  q:"Que sont les trois catégories de crypto-actifs selon MiCA ?",
  opts:["Bitcoin, Ethereum et stablecoins","Asset-referenced tokens (ART), e-money tokens (EMT) et autres crypto-actifs (dont utility tokens)","Tokens de paiement, tokens d'investissement et tokens utilitaires","Crypto-actifs centralisés, décentralisés et hybrides"],
  ans:[1],
  ex:"MiCA distingue : (1) les asset-referenced tokens (ART) — adossés à plusieurs actifs ; (2) les e-money tokens (EMT) — adossés à une seule devise fiduciaire (stablecoins) ; (3) les autres crypto-actifs, dont les utility tokens. Chaque catégorie est soumise à des obligations spécifiques d'émission, de transparence et de capital.",
  tags:['MiCA','ART','EMT','utility token','catégories']},

// ──────────── RÉGLEMENTATION (suite) ────────────
{id:'RG09',module:'reglementation',type:'qcm',diff:'easy',pts:10,
  q:"Quelles sont les deux principales missions de l'AMF ?",
  opts:["Superviser les banques et assurer la politique monétaire","Protéger l'épargne investie en instruments financiers et assurer le bon fonctionnement des marchés","Émettre la monnaie fiduciaire et superviser les assurances","Agréer les établissements de crédit et lutter contre la fraude fiscale"],
  ans:[1],
  ex:"L'AMF a deux missions principales : (1) protéger les épargnants qui investissent dans des produits financiers ; (2) veiller au bon fonctionnement des marchés financiers. Elle agrée et supervise les SGP, PSI et infrastructures de marché, et réglemente la diffusion de l'information financière.",
  tags:['AMF','missions','régulateur']},
{id:'RG10',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que l'ACPR et quel est son rôle ?",
  opts:["L'autorité européenne de supervision des marchés financiers","L'autorité française qui supervise les banques et assurances, adossée à la Banque de France","L'organisme national de résolution des litiges financiers","La commission parlementaire supervisant l'AMF"],
  ans:[1],
  ex:"L'ACPR (Autorité de Contrôle Prudentiel et de Résolution) est l'autorité de supervision française des banques et assurances, adossée à la Banque de France. Elle octroie les agréments bancaires, vérifie le respect des règles prudentielles (solvabilité, liquidité) et gère la résolution des établissements en défaillance.",
  tags:['ACPR','supervision bancaire','Banque de France']},
{id:'RG11',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Quel est le rôle de l'ESMA (European Securities and Markets Authority) ?",
  opts:["Émettre des obligations souveraines européennes","Superviser les marchés financiers et coordonner les régulateurs nationaux de l'UE, avec supervision directe de certaines entités","Définir la politique monétaire européenne","Agréer toutes les sociétés de gestion de l'Union Européenne"],
  ans:[1],
  ex:"L'ESMA (créée en 2011) assure l'intégrité et la stabilité des marchés financiers européens. Elle coordonne les régulateurs nationaux (dont l'AMF), publie des normes techniques, et supervise directement certaines entités : agences de notation, référentiels centraux, CCPs tierces pays.",
  tags:['ESMA','régulateur européen','supervision']},
{id:'RG12',module:'reglementation',type:'qcm',diff:'easy',pts:10,
  q:"Quel est le principal objectif de la BCE ?",
  opts:["Financer les déficits des États de la zone euro","Assurer la stabilité des prix dans la zone euro, définie comme une inflation proche de 2 %","Superviser les établissements de crédit européens","Gérer les réserves de change de tous les États membres de l'UE"],
  ans:[1],
  ex:"La BCE est la banque centrale de la zone euro. Son objectif principal est la stabilité des prix : un taux d'inflation proche de 2 % à moyen terme. Elle fixe les taux directeurs (taux de refinancement, taux de facilité de dépôt) et conduit la politique monétaire unique de la zone euro.",
  tags:['BCE','politique monétaire','stabilité prix','taux directeurs']},
{id:'RG13',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Que prévoit EMIR 3.0 concernant les contreparties centrales (CCP) ?",
  opts:["La suppression des CCP européennes au profit des CCP américaines","Le renforcement de l'attractivité des CCP de l'UE via l'obligation d'un 'compte actif' pour réduire la dépendance aux CCP de pays tiers","L'interdiction de la compensation centrale pour les dérivés actions","L'obligation de localiser toutes les CCP au siège de la BCE"],
  ans:[1],
  ex:"Suite au Brexit, une grande partie de la compensation en euros se fait à LCH Ltd (Londres). EMIR 3.0 (2024) impose aux contreparties financières de maintenir un 'compte actif' dans une CCP de l'UE pour les produits dérivés les plus systémiques, réduisant la dépendance à LCH Londres.",
  tags:['EMIR 3.0','CCP','compensation centrale','Brexit']},
{id:'RG14',module:'reglementation',type:'qcm',diff:'hard',pts:20,
  q:"Que prévoit le règlement SFDR pour les gestionnaires d'actifs ?",
  opts:["La réglementation exclusive des fonds d'investissement structurés","La publication d'informations standardisées sur l'intégration des risques de durabilité, classifiant les fonds en Articles 6, 8 et 9","La réforme de la directive sur la transparence des émetteurs","Le cadre réglementaire pour les obligations vertes souveraines"],
  ans:[1],
  ex:"SFDR (Sustainable Finance Disclosure Regulation, mars 2021) impose aux gestionnaires de publier des informations sur l'intégration des risques de durabilité. Il crée une classification : Article 6 (sans caractéristiques ESG), Article 8 (promouvant des caractéristiques ESG) et Article 9 (objectif d'investissement durable — 'dark green').",
  tags:['SFDR','durabilité','Article 8','Article 9']},
{id:'RG15',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Qu'harmonise la directive UCITS (OPCVM) au niveau européen ?",
  opts:["La directive régissant uniquement les hedge funds en Europe","Le cadre des organismes de placement collectif en valeurs mobilières destinés aux investisseurs particuliers","La directive sur les organismes de crédit européens","La directive sur les plans d'épargne retraite"],
  ans:[1],
  ex:"UCITS (Undertakings for Collective Investment in Transferable Securities) harmonise le cadre des fonds d'investissement vendus aux particuliers dans l'UE. Elle fixe des règles de diversification (5/10/40), de liquidité, de garde d'actifs et de transparence. Le passeport UCITS permet la commercialisation dans toute l'UE.",
  tags:['UCITS','OPCVM','directive','passeport européen']},
{id:'RG16',module:'reglementation',type:'qcm',diff:'hard',pts:20,
  q:"Quel a été le scandale à l'origine du règlement BMR sur les indices de référence ?",
  opts:["La manipulation des indices boursiers CAC 40 et DAX par des traders parisiens","La manipulation du LIBOR (London Interbank Offered Rate) par des traders de grandes banques internationales","La fraude sur les indices de matières premières agricoles par des hedge funds","La manipulation de l'EURIBOR par la BCE lors de la crise des dettes souveraines"],
  ans:[1],
  ex:"Le BMR (Benchmark Regulation) a été adopté suite au scandale du LIBOR : des traders de plusieurs grandes banques manipulaient leurs soumissions pour influencer le taux interbancaire de référence, utilisé dans des centaines de milliers de milliards de contrats financiers. Le BMR impose des règles strictes de gouvernance aux administrateurs d'indices.",
  tags:['BMR','LIBOR','indices de référence','manipulation']},
{id:'RG17',module:'reglementation',type:'qcm',diff:'easy',pts:10,
  q:"Dans quel cas le règlement Prospectus impose-t-il la publication d'un prospectus ?",
  opts:["Pour toute communication financière d'une société cotée","Lors d'une offre au public de titres financiers dépassant un seuil ou d'une admission sur un marché réglementé","Pour toute publicité financière diffusée dans les médias","Uniquement pour les OPA/OPE dépassant 30 % du capital"],
  ans:[1],
  ex:"Le règlement Prospectus (UE 2017/1129) impose la publication d'un prospectus approuvé par l'AMF lors d'une offre au public de titres (au-delà d'un seuil de 8 M€) ou d'une admission sur un marché réglementé. Ce document présente toutes les informations nécessaires pour évaluer l'émetteur et les titres proposés.",
  tags:['prospectus','offre publique','AMF','admission']},
{id:'RG18',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le mécanisme de bail-in dans l'Union bancaire européenne ?",
  opts:["Le remboursement des dépôts par le FGDR en cas de faillite bancaire","Le dispositif permettant de gérer la défaillance d'une banque en faisant absorber les pertes par actionnaires et créanciers avant tout recours aux contribuables","La fusion forcée de deux banques en difficulté par la BCE","Le recours systématique aux fonds publics pour recapitaliser les banques"],
  ans:[1],
  ex:"La BRRD (Bank Recovery and Resolution Directive) et le Mécanisme de Résolution Unique (MRU) prévoient le 'bail-in' : les actionnaires et créanciers absorbent les pertes avant tout recours aux fonds publics. Le Conseil de Résolution Unique (CRU) est l'autorité de résolution pour les banques de la zone euro.",
  tags:['bail-in','BRRD','MRU','résolution bancaire']},
{id:'RG19',module:'reglementation',type:'qcm',diff:'hard',pts:20,
  q:"Quels indicateurs macroéconomiques influencent principalement les marchés financiers ?",
  opts:["Le cours du pétrole et le prix de l'or uniquement","Le PIB, l'inflation (IPC/IPCH), le taux de chômage, la balance commerciale et les décisions de politique monétaire","Les cours des actions des banques centrales","La capitalisation boursière des 500 plus grandes entreprises mondiales"],
  ans:[1],
  ex:"Les marchés financiers surveillent notamment : le PIB (croissance), l'IPC/IPCH (inflation), le taux de chômage, la balance courante, et les décisions des banques centrales (Fed, BCE). Ces indicateurs influencent les anticipations sur les taux d'intérêt, les valorisations d'actifs et les flux de capitaux.",
  tags:['macroéconomie','PIB','inflation','indicateurs économiques']},
{id:'RG20',module:'reglementation',type:'qcm',diff:'medium',pts:15,
  q:"Que prévoit Bâle III pour les banques en matière de liquidité ?",
  opts:["L'interdiction des investissements dans des actifs illiquides","L'introduction de ratios de liquidité : LCR (Liquidity Coverage Ratio — résistance à 30 jours) et NSFR (Net Stable Funding Ratio — financement stable à 1 an)","L'obligation de maintenir 20 % des actifs en liquidités immédiatement disponibles","La centralisation de la gestion de la liquidité à la BCE"],
  ans:[1],
  ex:"Bâle III introduit deux ratios de liquidité : le LCR (ratio de couverture des besoins de liquidité à court terme sur 30 jours — minimum 100 %) et le NSFR (ratio de financement stable net sur 1 an — minimum 100 %). Ces normes sont transposées via le règlement CRR et la directive CRD en droit européen.",
  tags:['Bâle III','LCR','NSFR','liquidité bancaire']},

// ──────────── CONFORMITÉ (suite) ────────────
{id:'CF09',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une cartographie des risques de conformité ?",
  opts:["Un registre géographique des filiales d'un groupe financier","Un inventaire structuré et hiérarchisé des risques de non-conformité auxquels est exposée une organisation","Le tableau de bord des risques financiers de marché","La liste des contrôles réalisés par l'audit interne"],
  ans:[1],
  ex:"La cartographie des risques recense et hiérarchise les risques de non-conformité (réglementaires, déontologiques, LCB-FT…). Elle permet de prioriser les contrôles, d'allouer les ressources et de définir le plan de contrôle annuel. Sa mise à jour régulière est attendue par les régulateurs.",
  tags:['cartographie risques','conformité','plan de contrôle']},
{id:'CF10',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la gouvernance produit (Product Governance) sous MiFID II ?",
  opts:["L'obligation de former les équipes commerciales aux produits financiers","L'obligation pour les concepteurs de définir un marché cible et pour les distributeurs de vérifier l'adéquation des produits à leur clientèle","Le processus d'approbation réglementaire des nouveaux produits par l'AMF","L'obligation de créer un comité produit dans chaque PSI"],
  ans:[1],
  ex:"MiFID II impose aux producteurs de définir un 'marché cible' pour chaque produit (type de client, objectifs, risques) et aux distributeurs de vérifier que leur clientèle y correspond. Ce dispositif de Product Governance vise à éviter la distribution de produits inadaptés (misselling).",
  tags:['product governance','marché cible','MiFID II','misselling']},
{id:'CF11',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que l'alerte éthique (whistleblowing) ?",
  opts:["L'obligation d'un employé de refuser des ordres contraires à l'éthique","La procédure permettant aux collaborateurs de signaler de bonne foi des violations graves sans crainte de représailles, via un canal sécurisé","L'obligation de l'AMF d'alerter les émetteurs avant toute enquête","Le rapport annuel du RCCI au conseil d'administration"],
  ans:[1],
  ex:"La directive européenne Whistleblower (transposée en France en 2022) et la loi Sapin II imposent aux entreprises de mettre en place un canal d'alerte sécurisé et protègent les lanceurs d'alerte contre toute forme de représailles. Ce dispositif est un pilier du programme anti-corruption.",
  tags:['whistleblowing','alerte éthique','lanceur d\'alerte','Sapin II','']},
{id:'CF12',module:'conformite',type:'qcm',diff:'easy',pts:10,
  q:"À quelle fréquence minimale doit être révisée une politique de conformité ?",
  opts:["Tous les 5 ans uniquement en cas de changement réglementaire majeur","Au moins annuellement, ou lors de changements significatifs de la réglementation ou de l'activité","Tous les 3 ans lors du renouvellement de l'agrément AMF","Uniquement à la demande du conseil d'administration"],
  ans:[1],
  ex:"Les politiques et procédures de conformité doivent être revues au moins annuellement pour tenir compte des évolutions législatives, des changements d'activité et des résultats des contrôles. Cette revue documentée est une attente formelle des régulateurs (AMF, ACPR).",
  tags:['politique conformité','revue annuelle','réglementation']},
{id:'CF13',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le contrôle permanent de niveau 2 dans le modèle des 3 lignes de défense ?",
  opts:["L'audit annuel conduit par les commissaires aux comptes","Les contrôles réalisés par les fonctions conformité et risques, indépendamment des opérationnels","Les inspections de l'AMF sur pièces et sur place","Le contrôle des comptes réalisé par la direction financière"],
  ans:[1],
  ex:"Le contrôle de niveau 2 est assuré par des fonctions indépendantes des opérationnels : la conformité (RCCI), le contrôle des risques. Ces équipes vérifient que les contrôles de niveau 1 sont réalisés et effectuent leurs propres contrôles thématiques. C'est la 2ème ligne de défense du modèle des 3 lignes.",
  tags:['contrôle niveau 2','3 lignes de défense','conformité']},
{id:'CF14',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un RCSI dans un établissement de crédit ?",
  opts:["Responsable du Contrôle des Services d'Investissement","Responsable de la Conformité pour les Services d'Investissement — équivalent du RCCI dans les établissements de crédit fournissant des services d'investissement","Responsable du Crédit et des Structures d'Investissement","Référent Conformité du Système d'Information"],
  ans:[1],
  ex:"Le RCSI est la fonction équivalente au RCCI dans les établissements de crédit qui fournissent des services d'investissement. Il est nommé obligatoirement et doit être certifié AMF. Il est responsable du dispositif de conformité pour les activités de marché et d'investissement de l'établissement.",
  tags:['RCSI','conformité','établissement de crédit','certification AMF']},
{id:'CF15',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Qu'implique l'externalisation d'une fonction critique selon MiFID II ?",
  opts:["La délégation à un tiers de toutes les fonctions réglementaires","La sous-traitance d'une fonction dont la défaillance affecterait significativement la qualité du service au client, avec obligations de surveillance continue et de notification à l'AMF","Le recours à un cabinet de conseil pour l'audit interne","La domiciliation d'une filiale dans un pays à faible fiscalité"],
  ans:[1],
  ex:"MiFID II impose que le PSI qui externalise une fonction critique (ex: gestion des ordres, conformité, IT) s'assure de la compétence du prestataire, surveille sa performance, maintient la capacité à reprendre la fonction et notifie l'AMF. La responsabilité réglementaire reste intégralement chez le PSI.",
  tags:['externalisation','fonctions critiques','MiFID II','responsabilité']},
{id:'CF16',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que la politique d'engagement actionnarial (stewardship) pour un gérant ?",
  opts:["La politique de distribution commerciale des fonds","La politique par laquelle un gérant exerce ses droits d'actionnaire (vote en AG, dialogue avec les dirigeants) pour influencer les pratiques ESG et de gouvernance","La politique de rémunération des gérants de portefeuille","Le cahier des charges pour l'intégration ESG dans les mandats de gestion"],
  ans:[1],
  ex:"L'engagement actionnarial (stewardship) désigne les actions par lesquelles un investisseur institutionnel exerce ses droits pour influencer positivement la stratégie, la gouvernance et les pratiques ESG des entreprises investies. La directive SRD II (Shareholder Rights Directive) a renforcé ces obligations.",
  tags:['stewardship','engagement','SRD II','vote en AG']},
{id:'CF17',module:'conformite',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que la certification professionnelle AMF et à qui s'applique-t-elle ?",
  opts:["L'agrément accordé par l'AMF aux sociétés de gestion","La certification individuelle obtenue par examen, requise pour certains professionnels des marchés financiers : RCCI/RCSI, CGP, conseillers, gérants pour compte de tiers","Le label attribué aux produits financiers agréés par l'AMF","L'accréditation des organismes de formation en finance"],
  ans:[1],
  ex:"La certification AMF est une certification individuelle obtenue par examen, requise pour exercer certaines fonctions dans les PSI et SGP. Elle atteste d'un niveau de connaissance minimal sur les marchés financiers, les produits et la réglementation. Sa durée de validité est de 5 ans, renouvelable par formation continue.",
  tags:['certification AMF','RCCI','professionnels marchés']},
{id:'CF18',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Que couvre DORA (Digital Operational Resilience Act) pour les entités financières ?",
  opts:["La directive sur la notation des instruments financiers","Le cadre de résilience opérationnelle numérique : gestion des risques IT, tests de résilience, surveillance des prestataires TIC critiques","Une norme comptable pour le secteur bancaire","Une réglementation sur les données personnelles des clients financiers"],
  ans:[1],
  ex:"DORA (applicable depuis janvier 2025) établit des exigences uniformes de résilience numérique pour les entités financières : gestion des risques liés aux TIC, gestion des incidents, tests de résilience (dont TLPT — Threat-Led Penetration Testing), surveillance des prestataires TIC tiers et partage d'informations sur les cybermenaces.",
  tags:['DORA','résilience numérique','risques TIC','cybersécurité']},
{id:'CF19',module:'conformite',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que FATCA et ses implications pour les établissements financiers hors États-Unis ?",
  opts:["Une loi française sur la lutte contre la fraude fiscale des entreprises","Une loi américaine de 2010 obligeant les institutions financières étrangères à identifier et déclarer à l'IRS les comptes détenus par des contribuables américains","La réglementation européenne sur l'échange automatique de données fiscales","La convention OCDE sur l'élimination de la double imposition"],
  ans:[1],
  ex:"FATCA (Foreign Account Tax Compliance Act, 2010) oblige les institutions financières étrangères à identifier les comptes détenus par des contribuables américains et à les déclarer à l'IRS. La non-conformité expose les établissements à une retenue à la source de 30 % sur certains flux provenant des États-Unis.",
  tags:['FATCA','conformité fiscale','contribuables américains','IRS']},
{id:'CF20',module:'conformite',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le standard CRS de l'OCDE et comment se distingue-t-il de FATCA ?",
  opts:["Un standard de reporting comptable pour les banques centrales","Le standard multilatéral OCDE d'échange automatique d'informations fiscales entre plus de 100 pays signataires — contrairement à FATCA qui est unilatéral américain","Un standard de communication entre infrastructures de marché","Le référentiel de contrôle interne des institutions financières de l'OCDE"],
  ans:[1],
  ex:"Le CRS (Common Reporting Standard) est le standard OCDE d'échange automatique d'informations fiscales (AEOI). Contrairement à FATCA (centré sur les contribuables américains), le CRS est multilatéral : plus de 100 pays échangent réciproquement les informations sur les comptes de leurs résidents fiscaux.",
  tags:['CRS','OCDE','échange automatique','évasion fiscale','FATCA']},

// ──────────── DÉONTOLOGIE (suite) ────────────
{id:'DE09',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le 'churning' (barattage) en gestion de portefeuille ?",
  opts:["Une stratégie d'investissement basée sur une rotation rapide de portefeuille légale","Le fait de multiplier les transactions sur le compte d'un client pour générer des commissions, sans que cela soit justifié par l'intérêt du client","Une technique de diversification excessive","Le recours abusif aux ordres stop-loss sur les marchés"],
  ans:[1],
  ex:"Le churning consiste à effectuer un nombre excessif de transactions sur le compte d'un client sous mandat pour générer des commissions, sans justification par la stratégie d'investissement. C'est une violation de l'obligation d'agir au mieux des intérêts du client (MiFID II), sanctionnée par l'AMF.",
  tags:['churning','barattage','conflit intérêts','gestion mandat']},
{id:'DE10',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le 'spoofing' comme manipulation de marché ?",
  opts:["Une stratégie de trading haute fréquence légale","Le fait de placer des ordres volumineux sans intention de les exécuter pour créer une fausse apparence de demande ou d'offre, puis les annuler","Une forme de front running sur les marchés à terme","L'utilisation de comptes multiples pour masquer une position"],
  ans:[1],
  ex:"Le spoofing consiste à placer des ordres volumineux sans intention de les exécuter pour manipuler les anticipations des autres participants (carnet d'ordres), puis à les annuler et à traiter dans la direction opposée. Le layering est une variante avec plusieurs niveaux de prix. Tous deux sont explicitement interdits par MAR.",
  tags:['spoofing','layering','manipulation marché','MAR']},
{id:'DE11',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que le 'scalping' comme manipulation de marché à ne pas confondre avec le trading scalping légal ?",
  opts:["Une stratégie de trading à très court terme légale","La pratique d'acheter des titres, de diffuser des recommandations positives pour faire monter le cours, puis de vendre à profit — dissimulant un conflit d'intérêts","Une stratégie d'arbitrage entre différentes places boursières","Le recours à des algorithmes pour profiter des microfluctuations de prix"],
  ans:[1],
  ex:"Le scalping-manipulation consiste à acheter des titres, publier des recommandations positives présentées comme objectives pour faire monter le cours, puis vendre ses positions à profit. Cette pratique est interdite par MAR car elle dissimule un conflit d'intérêts derrière une recommandation d'investissement.",
  tags:['scalping','manipulation','recommandation','conflit intérêts','MAR']},
{id:'DE12',module:'deontologie',type:'qcm',diff:'easy',pts:10,
  q:"Dans quel délai les dirigeants (PDMR) doivent-ils déclarer leurs transactions sur les titres de leur société ?",
  opts:["Dans les 24 heures suivant la transaction","Dans les 3 jours ouvrables suivant la transaction, dès que le cumul annuel dépasse 20 000 €","Dans les 10 jours ouvrables","Lors de la publication des résultats suivants"],
  ans:[1],
  ex:"MAR impose aux PDMR (Persons Discharging Managerial Responsibilities — dirigeants mandataires) et à leurs proches de déclarer leurs transactions à l'AMF et à l'émetteur dans les 3 jours ouvrables suivant la transaction. Le seuil de déclenchement est de 20 000 € par année civile.",
  tags:['PDMR','déclaration dirigeants','MAR','3 jours']},
{id:'DE13',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une fenêtre négative (closed period) pour les dirigeants d'une société cotée ?",
  opts:["Les périodes de fermeture des marchés boursiers (jours fériés, week-ends)","Une période de 30 jours calendaires avant la publication de résultats financiers périodiques pendant laquelle les PDMR ne peuvent pas effectuer de transactions sur les titres de leur société","Les plages horaires sans cotation pour les small caps","Les périodes d'interdiction de distribution de dividendes ordinaires"],
  ans:[1],
  ex:"MAR impose une closed period de 30 jours calendaires avant chaque publication de résultats financiers périodiques (annuels, semestriels). Les émetteurs peuvent fixer des périodes supplémentaires dans leur charte éthique. Des exceptions existent dans des circonstances exceptionnelles (ex: difficultés financières).",
  tags:['fenêtres négatives','closed periods','MAR','PDMR']},
{id:'DE14',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Comment MAR définit-il largement une 'recommandation d'investissement' ?",
  opts:["Uniquement les rapports formels d'analystes financiers accrédités","Toute information recommandant ou suggérant explicitement ou implicitement une stratégie d'investissement, quelle qu'en soit la forme ou le canal de diffusion","Les seuls avis émis par les sociétés de gestion dans leurs mandats","Les recommandations émises uniquement par les personnes certifiées AMF"],
  ans:[1],
  ex:"MAR couvre largement les recommandations : rapports d'analystes sell-side et buy-side, posts de blogs financiers, newsletters, et certaines communications sur les réseaux sociaux. Des obligations de transparence s'imposent : identification de l'auteur, divulgation des conflits d'intérêts, bases de la recommandation.",
  tags:['recommandation investissement','MAR','analyste','conflits intérêts']},
{id:'DE15',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Que signifie concrètement le principe de prévalence de l'intérêt du client en MiFID II ?",
  opts:["L'obligation pour un PSI de facturer des frais inférieurs à ses concurrents","L'obligation d'agir honnêtement et équitablement dans l'intérêt du client, en identifiant et gérant les conflits d'intérêts, et en les divulguant si la gestion est insuffisante","L'interdiction absolue pour un PSI de prendre des positions pour compte propre","L'obligation de proposer uniquement les produits les moins risqués aux clients"],
  ans:[1],
  ex:"Ce principe, pilier de MiFID II, implique : (1) identifier les conflits d'intérêts potentiels, (2) mettre en place des procédures pour les gérer (muraille de Chine, séparation des rémunérations), (3) si la gestion est insuffisante, les divulguer au client avant d'agir. En dernier ressort, les PSI doivent éviter les conflits irréductibles préjudiciables au client.",
  tags:['intérêt du client','MiFID II','conflits intérêts','règles de conduite']},
{id:'DE16',module:'deontologie',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que le 'market timing' abusif dans les OPCVM, interdit par les régulateurs ?",
  opts:["La gestion active basée sur les tendances macroéconomiques, pratique légale","L'exploitation des décalages temporels dans le calcul de la VL pour arbitrer entre VL et valeur de marché, au détriment des porteurs long terme","L'achat et la vente d'OPCVM dans la même journée sans commission","La prise de position contraire à la tendance du marché"],
  ans:[1],
  ex:"Le market timing abusif consiste à exploiter les décalages de calcul de la VL (ex: fonds investis en actifs asiatiques dont la VL est calculée avant clôture des marchés asiatiques) pour arbitrer. Cette pratique dilue la valeur des parts des investisseurs long terme et est interdite par les régulateurs.",
  tags:['market timing','OPCVM','dilution','VL']},
{id:'DE17',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Quel scandale majeur a conduit à la réglementation de la manipulation des taux de référence ?",
  opts:["La fraude Kerviel chez Société Générale en 2008","Le scandale du LIBOR : des traders de grandes banques manipulaient leurs soumissions pour influencer le taux interbancaire de référence utilisé dans des milliers de milliards de contrats","La fraude Madoff sur les fonds de placement en 2008","Le scandale Enron sur la manipulation des prix de l'énergie"],
  ans:[1],
  ex:"Le scandale du LIBOR (découvert en 2012) a impliqué des traders de Barclays, UBS, Deutsche Bank et d'autres. Ils manipulaient leurs soumissions pour favoriser leurs positions sur dérivés ou donner l'apparence d'une meilleure santé financière. Ce scandale a conduit à l'adoption du règlement BMR en 2016.",
  tags:['manipulation benchmark','LIBOR','BMR','scandale']},
{id:'DE18',module:'deontologie',type:'qcm',diff:'medium',pts:15,
  q:"Quelles sont les sanctions pénales en France pour le délit d'initié ?",
  opts:["Amende jusqu'à 10 000 € et blâme de l'AMF","Emprisonnement jusqu'à 5 ans et amende jusqu'à 100 millions d'euros ou décuple du profit réalisé si supérieur","Uniquement des sanctions administratives de l'AMF sans poursuites pénales","Suspension de l'agrément professionnel pour 2 ans maximum"],
  ans:[1],
  ex:"En France, le délit d'initié est une infraction pénale punie d'un emprisonnement de 5 ans et d'une amende pouvant atteindre 100 millions d'euros ou, si le montant est supérieur, jusqu'au décuple du profit réalisé. Des sanctions administratives AMF (amende, interdiction professionnelle) peuvent s'y ajouter.",
  tags:['sanctions pénales','délit initié','AMF','emprisonnement']},
{id:'DE19',module:'deontologie',type:'qcm',diff:'easy',pts:10,
  q:"Quels sont les 4 critères cumulatifs d'une information privilégiée selon MAR ?",
  opts:["Confidentielle, précise, récente et financière","Précise, non publique, relative à un émetteur ou instrument financier, et susceptible d'influencer significativement le cours si elle était rendue publique","Connue de moins de 10 personnes, non déposée, récente et matérielle","Interne, non communiquée, stratégique et datée de moins de 3 mois"],
  ans:[1],
  ex:"MAR définit une information privilégiée comme : (1) précise (se rapportant à des circonstances existantes ou raisonnablement attendues) ; (2) non publique ; (3) relative à un émetteur ou instrument financier ; (4) susceptible d'influencer le cours de façon sensible si rendue publique ('reasonable investor test').",
  tags:['information privilégiée','MAR','4 critères','délit initié']},
{id:'DE20',module:'deontologie',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le 'painting the tape' comme technique de manipulation de marché ?",
  opts:["La publication de graphiques trompeurs dans des rapports annuels","La réalisation de transactions circulaires entre entités liées pour créer une fausse apparence d'activité et de volume sur un titre","La publication de prévisions de résultats délibérément optimistes","L'utilisation d'algorithmes pour faire varier rapidement les prix affichés"],
  ans:[1],
  ex:"Le painting the tape consiste à effectuer une série de transactions entre parties liées pour créer une fausse impression de volume et d'activité, attirant d'autres investisseurs vers un titre peu liquide. Explicitement interdit par MAR au titre des manipulations de marché.",
  tags:['painting the tape','manipulation cours','transactions circulaires','MAR']},

// ──────────── GESTION COLLECTIVE (suite) ────────────
{id:'GC09',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Quel est le rôle du dépositaire d'OPCVM ?",
  opts:["La société de gestion qui administre le fonds au quotidien","L'établissement de crédit qui conserve les actifs du fonds, contrôle la régularité des décisions de gestion et assure la garde des instruments financiers","L'AMF dans son rôle de contrôle des fonds","Le commissaire aux comptes certifiant les comptes annuels du fonds"],
  ans:[1],
  ex:"Le dépositaire d'OPCVM (UCITS V) assure trois missions : (1) conservation des actifs du fonds (garde et tenue de compte-conservation) ; (2) contrôle de la régularité des décisions de gestion par rapport au prospectus ; (3) suivi des flux de liquidités. Il engage sa responsabilité vis-à-vis des porteurs.",
  tags:['dépositaire','OPCVM','garde actifs','UCITS V']},
{id:'GC10',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un OPCVM à formule (fonds à formule) ?",
  opts:["Un OPCVM dont le montant remboursé est déterminé par une formule mathématique préétablie appliquée à un sous-jacent, avec protection partielle ou totale du capital","Un fonds dont la composition exacte du portefeuille est préétablie pour toute sa durée","Un fonds géré par un algorithme quantitatif d'intelligence artificielle","Un OPCVM investi exclusivement en produits dérivés OTC"],
  ans:[0],
  ex:"Un fonds à formule est un OPCVM dont le montant remboursé à l'échéance est déterminé par une formule mathématique connue à l'avance, appliquée à un ou plusieurs sous-jacents (indice, panier). Il offre souvent une protection partielle ou totale du capital. L'AMF veille à ce que la formule soit compréhensible par les investisseurs.",
  tags:['OPCVM formule','capital protégé','sous-jacent','formule']},
{id:'GC11',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un fonds de fonds (fund of funds) et quel est son inconvénient principal ?",
  opts:["Un fonds qui investit uniquement dans des obligations d'entreprises, inconvénient : concentration","Un OPCVM dont le portefeuille est composé de parts d'autres OPC, inconvénient : double couche de frais","Un fonds géré par plusieurs sociétés de gestion en co-gestion, inconvénient : conflits de gouvernance","Un fonds compartimenté multi-devises, inconvénient : risque de change"],
  ans:[1],
  ex:"Un fonds de fonds (FoF) investit principalement dans des parts d'autres OPC plutôt que directement en instruments financiers. Il offre une diversification supplémentaire mais génère une double couche de frais : les frais courants du FoF s'ajoutent aux frais des fonds sous-jacents, réduisant la performance nette.",
  tags:['fonds de fonds','FoF','double couche de frais','OPCVM']},
{id:'GC12',module:'gestion_collective',type:'qcm',diff:'easy',pts:10,
  q:"Comment est calculée la valeur liquidative (VL) d'un OPCVM ?",
  opts:["La moyenne des cours de clôture des 10 plus grandes positions","L'actif net du fonds (actifs - passifs) divisé par le nombre de parts en circulation, calculée chaque jour ouvré","Le taux de rendement annualisé du fonds sur les 3 dernières années","Le montant maximum pouvant être souscrit en une journée par un seul investisseur"],
  ans:[1],
  ex:"La VL (Net Asset Value) = Actif net du fonds / Nombre de parts. Elle est calculée chaque jour ouvré (ou selon la périodicité du fonds). C'est au prix de la VL que s'effectuent les souscriptions et rachats de parts ou d'actions. Elle fluctue en fonction de la valeur de marché des actifs du portefeuille.",
  tags:['valeur liquidative','VL','NAV','OPCVM','calcul']},
{id:'GC13',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la gestion actif-passif (ALM) appliquée aux fonds de pension ?",
  opts:["La gestion équilibrée entre actions et obligations pour maximiser le rendement","La gestion visant à aligner les caractéristiques des actifs (duration, flux) sur les engagements du passif (prestations futures) pour maîtriser le risque de taux","La comptabilisation simultanée des actifs et passifs selon les normes IFRS","La stratégie d'optimisation des ratios réglementaires d'un OPCVM"],
  ans:[1],
  ex:"L'ALM (Asset Liability Management) pour un fonds de pension consiste à investir dans des actifs (obligations longues, swaps de taux) dont les flux et la duration correspondent aux engagements de retraite futurs. Elle minimise le risque de taux et de liquidité. Le ratio de couverture (actifs / engagements) est l'indicateur clé.",
  tags:['ALM','gestion actif-passif','fonds de pension','duration','risque de taux']},
{id:'GC14',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que l'alpha d'un fonds (performance relative) ?",
  opts:["Les frais de gestion totaux d'un fonds sur une année","L'écart de performance entre le fonds et son indice de référence (benchmark), mesurant la valeur ajoutée du gérant actif","La performance brute du fonds sur une année civile","Le rendement du fonds divisé par le risque total pris"],
  ans:[1],
  ex:"L'alpha est l'excès de performance (positif ou négatif) du fonds par rapport à son benchmark, après ajustement du risque systématique (beta). Un alpha positif signifie que le gérant a surperformé à risque équivalent. C'est la mesure de la valeur ajoutée de la gestion active.",
  tags:['alpha','performance relative','benchmark','gestion active']},
{id:'GC15',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Quelle est la principale différence entre un hedge fund et un OPCVM UCITS ?",
  opts:["Un OPCVM UCITS a des frais plus élevés et un hedge fund des frais plus faibles","Un hedge fund (FIA) peut utiliser des stratégies interdites aux UCITS : vente à découvert, fort levier, dérivés intensifs ; il est réservé aux investisseurs professionnels","Un hedge fund investit uniquement en obligations d'État, un UCITS en actions","Un hedge fund a une liquidité quotidienne, un UCITS une liquidité trimestrielle"],
  ans:[1],
  ex:"Un hedge fund est un FIA qui utilise des stratégies non disponibles pour les UCITS : vente à découvert, fort effet de levier, utilisation intensive de dérivés, positions illiquides. Il est réservé aux investisseurs professionnels ou qualifiés. La directive AIFMD encadre leurs gestionnaires en Europe.",
  tags:['hedge fund','FIA','AIFMD','UCITS','stratégies alternatives']},
{id:'GC16',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Que mesure le ratio de Sharpe et comment l'interpréter ?",
  opts:["Le ratio frais de gestion totaux / rendement du fonds — plus il est élevé, plus le fonds est cher","Le rendement excédentaire par unité de risque (volatilité) par rapport au taux sans risque — plus il est élevé, meilleure est la performance ajustée au risque","Le ratio actif net / nombre de parts d'un OPCVM — indique la cherté relative","Le rapport entre performance absolue et performance relative du portefeuille"],
  ans:[1],
  ex:"Ratio de Sharpe = (Rp - Rf) / σp, où Rp = rendement du portefeuille, Rf = taux sans risque, σp = volatilité. Un ratio de 1 signifie qu'on obtient 1 unité de rendement excédentaire pour 1 unité de risque. Plus il est élevé, meilleure est l'efficience risque/rendement du gérant.",
  tags:['ratio de Sharpe','performance ajustée au risque','volatilité','rendement excédentaire']},
{id:'GC17',module:'gestion_collective',type:'qcm',diff:'easy',pts:10,
  q:"Quelle est la différence entre les frais courants (TER) et les droits d'entrée d'un OPCVM ?",
  opts:["Les frais courants sont variables selon la performance, les droits d'entrée sont fixes","Les droits d'entrée sont prélevés lors de la souscription (une seule fois), les frais courants (TER/OCF) sont prélevés annuellement sur l'actif et couvrent la gestion, l'administration et la garde","Les frais courants sont payés au distributeur, les droits d'entrée à la société de gestion","Il n'y a pas de différence : les deux termes désignent les frais de souscription"],
  ans:[1],
  ex:"Les droits d'entrée (max. 5 % en général) sont prélevés sur le montant souscrit une seule fois à l'entrée et rémunèrent le distributeur. Les frais courants (TER/OCF) couvrent annuellement la gestion (SGP), l'administration, le dépositaire, les frais de transaction du portefeuille. Tous doivent figurer dans le DICI.",
  tags:['droits entrée','TER','frais OPCVM','DICI']},
{id:'GC18',module:'gestion_collective',type:'qcm',diff:'hard',pts:20,
  q:"Quelle est la différence entre un régime de retraite à prestations définies (DB) et à cotisations définies (DC) ?",
  opts:["DB : investissement en actions uniquement, DC : obligations uniquement","DB : l'employeur garantit un niveau de rente prédéfini (ex: 60 % du dernier salaire) et supporte le risque ; DC : seuls les versements sont garantis, la rente dépend des performances","DB : réservé aux fonctionnaires, DC : accessible aux salariés du privé","DB : géré par l'État, DC : géré par des compagnies d'assurance privées"],
  ans:[1],
  ex:"Dans un régime DB (Defined Benefit), l'employeur garantit un niveau de retraite et supporte l'intégralité du risque de financement. Dans un régime DC (Defined Contribution), seul le montant des cotisations est garanti ; la rente finale dépend des performances d'investissement et est supportée par le salarié. La tendance mondiale est au basculement des DB vers les DC.",
  tags:['fonds de pension','DB','DC','risque de financement']},
{id:'GC19',module:'gestion_collective',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce que la délégation de gestion financière dans une SGP et quelles sont ses limites ?",
  opts:["La signature d'un mandat de gestion pour le compte d'un client institutionnel","Le fait pour une SGP de confier à une autre entité la gestion d'une partie ou de la totalité du portefeuille d'un fonds, tout en restant responsable vis-à-vis de ses clients et de l'AMF","La délégation des pouvoirs de signature au directeur d'investissement","Le transfert de la gestion administrative et comptable à un administrateur de fonds"],
  ans:[1],
  ex:"La délégation de gestion financière permet à une SGP de confier la gestion à une autre entité (souvent étrangère spécialisée). La SGP délégante reste responsable vis-à-vis de ses clients et de l'AMF : elle doit contrôler le délégataire, ne peut déléguer à une entité non agréée, et ne peut se décharger de sa responsabilité réglementaire.",
  tags:['délégation de gestion','SGP','responsabilité','AMF']},
{id:'GC20',module:'gestion_collective',type:'qcm',diff:'easy',pts:10,
  q:"Quels sont les avantages de la gestion indicielle passive par rapport à la gestion active ?",
  opts:["Meilleure performance garantie à long terme et équipe de gestion plus expérimentée","Des frais de gestion sensiblement inférieurs et une tracking error très faible vis-à-vis de l'indice de référence","Une protection contre les baisses de marché et une liquidité quotidienne garantie","Une diversification inférieure mais une meilleure sélectivité des titres"],
  ans:[1],
  ex:"La gestion passive vise à répliquer fidèlement un indice (CAC 40, S&P 500…) avec le minimum de coûts. Ses principaux avantages : TER très faible (0,05 % à 0,5 % vs 1 % à 2 % pour la gestion active), tracking error minimale, pas de risque de sous-performance par rapport au benchmark. Les études académiques montrent qu'une majorité de gérants actifs sous-performent leur indice à long terme.",
  tags:['gestion passive','ETF','indiciel','TER','tracking error']},

// ──────────── PRODUITS DÉRIVÉS (suite) ────────────
{id:'PD09',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Que mesure le gamma d'une option et dans quel contexte est-il crucial ?",
  opts:["La sensibilité du prix de l'option à une variation de 1 % du taux sans risque","La sensibilité du delta à une variation du sous-jacent — il est crucial pour les stratégies de delta-hedging dynamique","La perte de valeur temps de l'option par jour de passage du temps","La sensibilité du prix de l'option à une variation de la volatilité implicite"],
  ans:[1],
  ex:"Le gamma mesure la vitesse de variation du delta par rapport au sous-jacent. Un gamma élevé (options ATM proches de l'échéance) signifie que le delta change rapidement et que le delta-hedging doit être fréquemment rebalancé. Les vendeurs d'options ont un gamma négatif (convexité défavorable).",
  tags:['gamma','grecques','delta-hedging','ATM']},
{id:'PD10',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Que mesure le thêta d'une option et qui en bénéficie ?",
  opts:["La variation du delta suite à une variation de dividende du sous-jacent","La perte de valeur temps de l'option par unité de temps — les vendeurs d'options en bénéficient, les acheteurs en souffrent","La sensibilité de l'option aux variations du taux sans risque","La sensibilité du delta à la volatilité implicite"],
  ans:[1],
  ex:"Le thêta mesure la dégradation de la valeur temps d'une option avec le passage du temps. Il est négatif pour les acheteurs d'options (erosion quotidienne de valeur) et positif pour les vendeurs. Le thêta s'accélère significativement dans les dernières semaines avant l'échéance.",
  tags:['thêta','valeur temps','options','time decay']},
{id:'PD11',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Quelle est la différence entre un FX swap et un cross-currency swap ?",
  opts:["Un FX swap est en euros uniquement, un cross-currency swap concerne des devises non-euro","Un FX swap échange du principal au comptant et à terme (court terme) ; un cross-currency swap échange également les paiements d'intérêts dans deux devises (long terme)","Un FX swap est coté sur marchés organisés, un cross-currency swap est OTC","Un FX swap protège contre le risque de change, un cross-currency swap contre le risque de taux"],
  ans:[1],
  ex:"Un FX swap court terme : échange de devises au comptant + réchange à terme (utilisé pour gérer la liquidité en devises). Un cross-currency swap long terme : échange de principal ET de flux d'intérêts dans deux devises différentes (utilisé pour la couverture de financement en devise étrangère sur plusieurs années).",
  tags:['FX swap','cross-currency swap','taux de change','couverture devise']},
{id:'PD12',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une option barrière et comment fonctionne-t-elle ?",
  opts:["Une option dont le prix d'exercice est très éloigné du cours actuel du sous-jacent","Une option exotique qui s'active (knock-in) ou se désactive (knock-out) si le sous-jacent franchit un niveau prédéfini (barrière)","Une option qui protège automatiquement contre toute perte supérieure à la prime payée","Une option réglementée dont le prix est fixé par une chambre de compensation"],
  ans:[1],
  ex:"Les options barrière ont des caractéristiques non-standard : les knock-in s'activent si le sous-jacent touche la barrière, les knock-out s'annulent si elle est touchée. Elles sont moins chères que les options vanille car leur probabilité d'exercice est conditionnelle. Les variantes 'up-and-out', 'down-and-in' etc. permettent diverses stratégies de couverture.",
  tags:['option barrière','knock-in','knock-out','options exotiques']},
{id:'PD13',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un collar et dans quel contexte est-il utilisé ?",
  opts:["Une stratégie de vente à découvert d'options sur un titre en portefeuille","L'achat simultané d'un put protecteur et la vente d'un call sur une position action existante, encadrant les gains et les pertes dans une fourchette de prix","Une stratégie de trading directionnel sans coût initial","Un produit structuré à capital garanti émis par une banque"],
  ans:[1],
  ex:"Un collar consiste à acheter un put (protection contre la baisse sous le strike put) et à vendre un call (abandon du gain au-delà du strike call) sur une position action existante. La prime du call vendu finance en partie le put acheté (zero-cost collar si primes égales). Utilisé par les dirigeants pour protéger leurs participations.",
  tags:['collar','put protecteur','call couvert','zero-cost collar']},
{id:'PD14',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Que représente la volatilité implicite et comment l'interpréter par rapport à la volatilité historique ?",
  opts:["La volatilité historique calculée sur 30 jours glissants du sous-jacent","La volatilité forward extraite du prix de marché d'une option — si supérieure à la volatilité historique, le marché anticipe une hausse de turbulences","L'écart-type des rendements de l'option elle-même sur 30 jours","La volatilité maximale autorisée dans un mandat de gestion"],
  ans:[1],
  ex:"La volatilité implicite est extraite en inversant le modèle Black-Scholes à partir du prix observé d'une option. Elle est forward-looking (anticipation). Si la vol implicite > vol historique, le marché paye une prime pour se protéger d'une volatilité à venir plus élevée. Le VIX (indice de la peur) mesure la vol implicite à 30 jours du S&P 500.",
  tags:['volatilité implicite','historique','Black-Scholes','VIX','fear index']},
{id:'PD15',module:'derives',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce qu'un appel de marge et quelles en sont les conséquences en cas de non-paiement ?",
  opts:["Une demande de renouvellement d'un prêt margin au-delà de son échéance","La demande de versement de fonds supplémentaires lorsque la perte latente sur une position futures fait descendre le dépôt en dessous du niveau de maintenance — la position est liquidée en cas de non-paiement","La réévaluation quotidienne d'un contrat futures à son prix de marché","L'obligation de couvrir une position de change ouverte avant la clôture des marchés"],
  ans:[1],
  ex:"Un appel de marge survient lorsque le dépôt de garantie (margin account) tombe sous le maintenance margin suite à des pertes latentes. L'investisseur doit ramener le compte au niveau de la marge initiale (initial margin). En cas de non-paiement dans le délai imparti, la chambre de compensation ou le courtier liquide d'office la position.",
  tags:['appel de marge','futures','margin call','liquidation','CCP']},
{id:'PD16',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que le basis risk et pourquoi rend-il une couverture imparfaite ?",
  opts:["Le risque de défaut de la contrepartie dans un contrat OTC","L'écart (basis) entre le prix du dérivé de couverture et le prix de l'exposition sous-jacente, qui peut fluctuer et rendre la couverture imparfaite","Le risque de variation des taux d'intérêt affectant la valeur d'un swap de couverture","Le risque opérationnel lié au dénouement physique des contrats dérivés sur matières premières"],
  ans:[1],
  ex:"Le basis risk survient lorsque le dérivé de couverture n'est pas parfaitement corrélé à l'exposition sous-jacente. Ex: couvrir un portefeuille d'actions small cap avec un future sur CAC 40 — si les small caps chutent plus que le CAC, la couverture est insuffisante. Plus la corrélation est instable, plus le basis risk est élevé.",
  tags:['basis risk','couverture imparfaite','corrélation','hedging']},
{id:'PD17',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un cap de taux et dans quel contexte est-il utilisé ?",
  opts:["Une limite réglementaire sur les taux d'intérêt des crédits immobiliers","Une option sur taux d'intérêt qui garantit à l'acheteur de ne pas payer plus qu'un certain taux sur un emprunt à taux variable, sur une durée définie","Un accord de plafonnement des rémunérations variables dans les banques","Un mécanisme de contrôle des taux de rendement des OPCVM monétaires"],
  ans:[1],
  ex:"Un cap de taux est une série d'options (caplets) qui protège un emprunteur à taux variable contre une hausse des taux au-delà d'un niveau plafond (strike). L'acheteur du cap paie une prime unique. Si le taux de référence (ex: Euribor) dépasse le strike, il reçoit la différence. Utilisé par les entreprises emprunteuses à taux variable.",
  tags:['cap de taux','caplet','protection hausse taux','couverture']},
{id:'PD18',module:'derives',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que l'obligation de compensation centrale imposée par EMIR pour les dérivés OTC ?",
  opts:["L'obligation de coter tous les dérivés OTC sur des marchés réglementés","L'obligation de compenser certains dérivés OTC standardisés via des contreparties centrales (CCP) agréées, réduisant le risque de contrepartie bilatéral","L'obligation pour les deux contreparties d'un dérivé OTC de déposer une garantie auprès de la BCE","La suppression du risque de contrepartie par nationalisation des CCP"],
  ans:[1],
  ex:"EMIR (2012) impose la compensation centrale obligatoire pour les catégories de dérivés OTC standardisés désignées par l'ESMA (ex: IRS en euros, CDS iTraxx). La CCP s'interpose entre les deux contreparties (novation), éliminant le risque de contrepartie bilatéral. Pour les dérivés non-compensés centralement, des exigences de collatéral bilatéral s'appliquent.",
  tags:['EMIR','compensation centrale','CCP','risque contrepartie','novation']},
{id:'PD19',module:'derives',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un dérivé first-to-default (FTD) ?",
  opts:["Un CDS sur le premier émetteur d'un secteur par taille de capitalisation","Un dérivé de crédit déclenché par le premier événement de crédit dans un panier de N noms de référence — plus risqué qu'un CDS individuel sur les noms les plus risqués du panier","Un dérivé indexé sur le taux de défaut annuel d'un secteur économique","Un CDO dont la première tranche absorbe les premières pertes"],
  ans:[1],
  ex:"Un FTD (First-to-Default) est déclenché par le premier défaut parmi N entités. Le vendeur de protection est exposé au premier défaut du panier, quelle que soit l'entité concernée. La prime est supérieure à celle d'un CDS simple sur la meilleure signature du panier, car l'exposition est à la corrélation entre les événements de crédit.",
  tags:['first-to-default','dérivés de crédit','panier CDS','corrélation']},
{id:'PD20',module:'derives',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que la parité call-put et à quoi sert-elle ?",
  opts:["Le fait que le prix d'un call et d'un put de mêmes caractéristiques soit toujours identique sur tout marché organisé","Une relation mathématique liant le prix d'un call européen et d'un put européen de même strike et maturité, garantissant l'absence d'arbitrage entre options et sous-jacent","L'obligation pour les market makers d'afficher simultanément des prix call et put équilibrés","La règle réglementaire limitant l'écart de prix entre puts et calls de même maturité"],
  ans:[1],
  ex:"Parité call-put : C - P = S - K×e^(-rT) pour des options européennes. Cette relation garantit qu'il est impossible de réaliser un arbitrage sans risque entre calls, puts et le sous-jacent. Si violée, une stratégie d'arbitrage est possible jusqu'à ce que les prix se réajustent.",
  tags:['parité call-put','arbitrage','options européennes','Black-Scholes']},

// ──────────── MARCHÉS FINANCIERS (suite) ────────────
{id:'MF09',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un OTF (Organised Trading Facility) et en quoi diffère-t-il d'un MTF ?",
  opts:["L'OTF est coté en bourse, le MTF est exclusivement OTC","L'OTF est conçu pour les instruments non-actions (obligations, dérivés, ETS) et l'opérateur peut exercer un pouvoir discrétionnaire dans l'exécution des ordres, contrairement au MTF","L'OTF est supervisé par la BCE, le MTF par l'ESMA directement","L'OTF a des horaires d'ouverture étendus, le MTF des horaires standard"],
  ans:[1],
  ex:"L'OTF (Organised Trading Facility / Système Organisé de Négociation) est une catégorie introduite par MiFID II pour les instruments non-actions (obligations, dérivés, quotas d'émission ETS). L'opérateur d'un OTF peut exercer un pouvoir discrétionnaire dans le matching des ordres (ex: n'accepter que certains ordres), contrairement au MTF qui doit opérer de façon non-discrétionnaire.",
  tags:['OTF','MTF','MiFID II','pouvoir discrétionnaire','obligations']},
{id:'MF10',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce que la consolidation des données de marché (Consolidated Tape) visée par MiFID II et MiFIR ?",
  opts:["La fusion des marchés réglementés européens en une seule plateforme","Un système centralisé agrégant en temps quasi réel les prix et volumes de transactions de toutes les plateformes de négociation de l'UE, pour améliorer la transparence post-négociation","L'obligation pour les brokers de consolider les ordres de leurs clients avant exécution","Le reporting trimestriel des données agrégées de marché à l'ESMA"],
  ans:[1],
  ex:"La Consolidated Tape (CT) est un système centralisé qui agrège les données post-négociation (prix, volumes, heure) de toutes les plateformes de l'UE (marchés réglementés, MTF, OTF, internalisateurs systématiques). MiFIR révisé (2024) a finalement créé la CT pour les actions et les obligations, comblant un manque historique de transparence des marchés européens.",
  tags:['consolidated tape','MiFIR','transparence post-négociation','données marché']},
{id:'MF11',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'un internalisateur systématique (IS) et quelles sont ses obligations ?",
  opts:["Un PSI qui traite en interne les ordres sans les envoyer sur une plateforme externe, sans obligations spécifiques","Un PSI qui exécute de façon organisée et fréquente les ordres clients pour son propre compte, soumis à des obligations de transparence et de publication de cotations fermes","Une chambre de compensation qui internalise les risques de ses membres","Un broker qui consolide les ordres de ses clients avant de les exécuter sur le marché"],
  ans:[1],
  ex:"Un IS exécute de façon organisée, fréquente et systématique des ordres de clients pour son propre compte hors plateforme. MiFID II l'oblige à : publier des cotations fermes (bid/ask) pour les instruments pour lesquels il est IS, exécuter les ordres clients à des prix non moins favorables que ces cotations, et reporter les transactions post-négociation.",
  tags:['internalisateur systématique','IS','MiFID II','cotations fermes']},
{id:'MF12',module:'marches',type:'qcm',diff:'easy',pts:10,
  q:"Qu'est-ce que le marché primaire et pourquoi est-il distinct du marché secondaire ?",
  opts:["Le marché des grandes capitalisations (primary) vs les small caps (secondary)","Le marché où des titres nouveaux sont émis (l'émetteur reçoit les fonds), vs le marché secondaire où s'échangent des titres déjà existants (l'émetteur ne reçoit pas de fonds)","Le marché des dérivés vs le marché des titres de créance","Le marché interbancaire (primary) vs les marchés boursiers réglementés (secondary)"],
  ans:[1],
  ex:"Sur le marché primaire, les émetteurs (entreprises, États) lèvent des capitaux en émettant de nouveaux titres (IPO, émissions obligataires). L'émetteur reçoit directement les fonds. Sur le marché secondaire, les titres déjà existants s'échangent entre investisseurs sur les marchés boursiers — l'émetteur ne reçoit pas de fonds lors de ces transactions.",
  tags:['marché primaire','marché secondaire','IPO','émissions','levée de fonds']},
{id:'MF13',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Quelles sont les principales étapes d'une introduction en bourse (IPO) ?",
  opts:["Dépôt du dossier AMF, séance unique de cotation, annonce des résultats","Sélection des banques cheffes de file, due diligence, rédaction du prospectus (visé par l'AMF), book building (recueil des ordres), fixation du prix, admission à la cotation","Signature du contrat de privatisation, cession par blocs aux institutionnels, admission","Augmentation de capital réservée, rendu public des comptes 3 ans, cotation automatique"],
  ans:[1],
  ex:"Une IPO comprend : (1) sélection des banques introducteur (lead manager, co-manager) ; (2) due diligence et rédaction du prospectus visé par l'AMF ; (3) roadshow et book building (recueil des intentions d'achat des institutionnels) ; (4) fixation du prix d'introduction ; (5) allocation des titres ; (6) premier jour de cotation. Le délai total est typiquement 6-18 mois.",
  tags:['IPO','introduction en bourse','book building','prospectus','AMF']},
{id:'MF14',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Qu'est-ce qu'un dark pool et quel plafonnement MiFID II a-t-il introduit ?",
  opts:["Un marché nocturne réservé aux transactions de gré à gré entre institutionnels, sans plafonnement","Un MTF à transparence pré-négociation nulle ou réduite, soumis au double volume cap de MiFID II : 4 % par plateforme et 8 % sur l'ensemble des dark pools pour un titre donné","Un marché réglementé opérant sous dérogation temporaire de transparence, plafonné à 10 % des volumes","Un système interne d'exécution d'ordres institutionnels, sans aucune réglementation de volumes"],
  ans:[1],
  ex:"Les dark pools offrent une transparence pré-négociation réduite pour l'exécution de blocs sans impact de marché. MiFID II a introduit le double volume cap (DVC) : si les transactions sur un titre dépassent 4 % du volume sur un dark pool donné ou 8 % sur l'ensemble des dark pools de l'UE, les dérogations de transparence sont suspendues pendant 6 mois.",
  tags:['dark pool','double volume cap','DVC','MiFID II','blocs']},
{id:'MF15',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Quels sont les deux processus du post-marché et quelles entités les assurent ?",
  opts:["Exécution (Euronext, Cboe) et reporting (AMF, ESMA)","Compensation/clearing (LCH SA, Eurex Clearing via CCP) et règlement-livraison/settlement (Euroclear, Clearstream via CSD)","Cotation (Euronext) et conservation des titres (banques dépositaires)","Négociation (MTF) et supervision (ACPR, AMF)"],
  ans:[1],
  ex:"Le post-marché comprend : (1) la compensation (clearing) assurée par des CCP (LCH SA pour Euronext, Eurex Clearing pour Deutsche Börse) qui calculent les positions nettes et garantissent les transactions ; (2) le règlement-livraison (settlement) assuré par des CSD (Euroclear France, Clearstream) qui transfèrent effectivement espèces et titres (T+2).",
  tags:['post-marché','clearing','settlement','CCP','CSD','Euroclear']},
{id:'MF16',module:'marches',type:'qcm',diff:'easy',pts:10,
  q:"Quel est le rôle d'Euroclear France en tant que dépositaire central de titres ?",
  opts:["Euroclear France est une banque commerciale spécialisée dans la conservation de titres pour les particuliers","Euroclear France est le CSD français qui gère le registre central des titres dématérialisés, assure la compensation et le règlement des transactions sur les marchés français","Euroclear France est une filiale de la Banque de France supervisant les marchés obligataires","Euroclear France est la chambre de compensation des marchés dérivés français"],
  ans:[1],
  ex:"Euroclear France (anciennement SICOVAM) est le dépositaire central de titres (CSD) pour les titres émis en France. Il tient le registre central des titres sous forme dématérialisée, assure le règlement-livraison des transactions sur Euronext Paris (T+2), et gère les opérations sur titres (OST). Le règlement CSDR encadre son fonctionnement.",
  tags:['Euroclear France','CSD','règlement-livraison','titres dématérialisés']},
{id:'MF17',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Quel est le plafond de collecte annuel pour un financement participatif via un PSFP ?",
  opts:["500 000 € par an et par porteur de projet","5 millions d'euros par an et par porteur de projet, selon le règlement européen PSFP","10 millions d'euros par an pour les projets technologiques uniquement","Aucun plafond légal, uniquement des limites par investisseur individuel"],
  ans:[1],
  ex:"Le règlement européen sur les PSFP (Prestataires de Services de Financement Participatif, UE 2020/1503) fixe un plafond de 5 millions d'euros par porteur de projet et par an. Au-delà, l'émetteur doit publier un prospectus selon le règlement Prospectus. Les PSFP sont agréés par leur autorité nationale et bénéficient d'un passeport européen.",
  tags:['PSFP','crowdfunding','5 millions','règlement européen']},
{id:'MF18',module:'marches',type:'qcm',diff:'medium',pts:15,
  q:"Qu'est-ce qu'une offre publique d'achat (OPA) obligatoire et quel est le seuil déclencheur ?",
  opts:["Toute offre d'acquisition de titres cotés doit être obligatoirement une OPA, sans seuil","L'OPA devient obligatoire lorsqu'un actionnaire franchit le seuil de 30 % du capital ou des droits de vote, l'obligeant à offrir à tous les actionnaires de racheter leurs titres","L'OPA est obligatoire uniquement si l'acquéreur souhaite dépasser 50 % du capital","L'OPA obligatoire est déclenchée par tout achat de plus de 1 % sur une période de 12 mois"],
  ans:[1],
  ex:"Selon la réglementation AMF (art. 234-2 du RG AMF), tout actionnaire qui vient à détenir, directement ou indirectement, seul ou de concert, plus de 30 % du capital ou des droits de vote d'une société cotée est obligé de déposer une OPA sur la totalité du capital (ou une OPE). Cette règle protège les actionnaires minoritaires.",
  tags:['OPA obligatoire','30%','AMF','minoritaires','seuil déclencheur']},
{id:'MF19',module:'marches',type:'qcm',diff:'hard',pts:20,
  q:"Quelles obligations MiFID II impose-t-il aux PSI qui utilisent le trading algorithmique ?",
  opts:["Aucune obligation spécifique, le trading algorithmique étant une pratique commerciale standard","Tests des algorithmes avant déploiement, kill switch (arrêt d'urgence), limites de volumes, notification à l'autorité compétente, et conservation des logs pendant 5 ans minimum","Interdiction du trading algorithmique pour les PSI qui ne sont pas des teneurs de marché désignés","Obligation d'utiliser uniquement des algorithmes open-source validés par l'ESMA"],
  ans:[1],
